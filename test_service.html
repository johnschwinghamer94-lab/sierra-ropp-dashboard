        <div className="lf2-kpi"><div className="l">ON SITE NOW</div><div className="v" style={{color:"#4ade80"}}>{K.onSiteNow||0}</div><div className="s">crews active</div></div>
        <div className="lf2-kpi"><div className="l">OPTIONS IN PLAY</div><div className="v" style={{color:"#f5c518"}}>{fmt$(K.optionsInPlayTotal)}</div><div className="s">{K.optionsInPlayCount||0} options</div></div>
        <div className="lf2-kpi"><div className="l">SIGNED TODAY</div><div className="v" style={{color:"#4ade80"}}>{fmt$(K.signedTotal)}</div><div className="s">{K.signedJobs||0} jobs signed</div></div>
        <div className="lf2-kpi"><div className="l">LEADS SET</div><div className="v" style={{color:"#a78bfa"}}>{K.leadsSet||0}</div><div className="s">turnovers</div></div>
        <div className="lf2-kpi"><div className="l">MEMBERSHIPS SOLD</div><div className="v" style={{color:"#5BA4E6"}}>{K.membershipsSold||0}</div><div className="s">today</div></div>
      </div>

      {completed.length>0 && <div className="lf2-ticker">
        {completed.map(j=>{
          const dt=txt((j.stages||{}).done)||"✓";
          const techFirst=(j.tech||"?").split(" ")[0];
          const custRaw=j.customer||"";
          const cust=custRaw.length>28?(custRaw.slice(0,28)+"…"):custRaw;
          const sn=(j.stages||{}).signed;
          const signed=!!(sn&&typeof sn==="object");
          return (
            <div key={j.jobId} className="lf2-tick-chip">
              <span className="lf2-tick-time">{dt}</span>
              <span className="lf2-tick-tech">{techFirst}</span>
              <span className="lf2-tick-cust">{cust}</span>
              {signed && <span className="lf2-tick-signed">✦ SIGNED</span>}
            </div>
          );
        })}
      </div>}

      <div className="lf2-bus">
        {teamsList.map(t=>(
          <button key={t} className={"lf2-bu"+(teamFilter===t?" on":"")} onClick={()=>setTeamFilter(t)}>{t}</button>
        ))}
      </div>

      <div className="lf2-main">
        <div className="lf2-grid">
          {sorted.length ? sorted.map(jobCard) : <div className="lf2-empty">No jobs match this filter.</div>}
        </div>
        <div className="lf2-feed">
          <div className="lf2-fh">◆ Live Activity</div>
          {activity.length ? (
            <div className="lf2-evs">
              {activity.map((ev,i)=>(
                <div key={i} className={"lf2-ev"+(i===0?" first":"")}>
                  <span className="ico">{ev.i}</span>
                  <div>
                    <div className="x" style={ev.c?{color:ev.c}:null}>{ev.x}</div>
                    <div className="t">{ev.t}</div>
                  </div>
                </div>
              ))}
            </div>
          ) : <div style={{color:"#5d6fa8",fontSize:11,padding:"10px 4px"}}>No activity yet.</div>}
        </div>
      </div>
    </div>
  );
}

// ═══ DEPARTMENT PULSE (new "overview" tab) — servicedata.json ══════
function MonthPaceCard({budget,mtdRevenue}){
  const numOr0=v=>(typeof v==="number"&&isFinite(v))?v:0;
  const fmtFull=v=>"$"+Math.round(numOr0(v)).toLocaleString();
  const BLUE="#5BA4E6",GREEN="#22c55e",GOLD="#F5B324",RED="#E63946";
  const b=budget||{};
  const preMonth=!!b.preMonth;
  const target=numOr0(b.revenueTarget)||755333;
  const workingDays=numOr0(b.workingDays);
  const remainingDays=numOr0(b.remainingWorkingDays);
  const elapsedDays=Math.max(0,workingDays-remainingDays);
  const dailyTarget=numOr0(b.dailyRevTarget);
  const rev=numOr0(mtdRevenue);
  const pctOfTarget=target?Math.round((rev/target)*1000)/10:0;
  const projected = elapsedDays>0 ? (rev/elapsedDays)*workingDays : 0;
  const expectedToDate = dailyTarget*elapsedDays;
  const paceDelta = rev-expectedToDate;
  return (
    <div className="riseIn liftCard" style={{flex:"1 1 240px",background:"linear-gradient(160deg,#131c30,#0e1626)",border:"1px solid #1e2d47",borderRadius:16,padding:"14px 18px"}}>
      <div style={{fontSize:9,letterSpacing:"0.12em",color:"#7089ab",fontWeight:700}}>MONTH PACE</div>
      <div style={{display:"flex",alignItems:"baseline",gap:8,marginTop:4}}>
        <div style={{fontSize:26,fontWeight:900,color:BLUE}}>{pctOfTarget}%</div>
        <div style={{fontSize:9.5,color:"#6b7a99"}}>of {fmtFull(target)} target</div>
      </div>
      <div style={{display:"flex",gap:16,marginTop:10,flexWrap:"wrap"}}>
        <div>
          <div style={{fontSize:8,color:"#6b7a99",fontWeight:700,letterSpacing:"0.08em"}}>PROJECTED EOM</div>
          <div style={{fontSize:14,fontWeight:800,color:GOLD}}>{elapsedDays>0?fmtFull(projected):"—"}</div>
        </div>
        <div>
          <div style={{fontSize:8,color:"#6b7a99",fontWeight:700,letterSpacing:"0.08em"}}>PACE</div>
          <div style={{fontSize:14,fontWeight:800,color:paceDelta>=0?GREEN:RED}}>{paceDelta>=0?"▲ AHEAD ":"▼ BEHIND "}{fmtFull(Math.abs(paceDelta))}</div>
        </div>
      </div>
      <div style={{fontSize:9,color:"#6b7a99",marginTop:8}}>{preMonth?("month not yet started · preview vs "+fmtFull(dailyTarget)+"/working day"):(elapsedDays+" of "+workingDays+" working days elapsed")}</div>
    </div>
  );
}

function ServicePulseTab({onClassic}){
  const [d,setD]=React.useState(null);
  const [err,setErr]=React.useState(false);
  const [win,setWin]=React.useState("today");
  const [now,setNow]=React.useState(Date.now());

  const load=()=>{
    fetch("https://raw.githubusercontent.com/johnschwinghamer94-lab/sierra-ropp-dashboard/main/servicedata.json?_="+Date.now())
      .then(r=>{ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
      .then(j=>{ setD(j); setErr(false); })
      .catch(()=>setErr(true));
  };
  React.useEffect(()=>{ load(); const id=setInterval(load,120000); const t=setInterval(()=>setNow(Date.now()),60000); return ()=>{clearInterval(id);clearInterval(t);}; },[]);

  if(!d){
    return (<div className="lf2-wrap riseIn" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"50vh"}}>
      <div style={{color:"#8fa3d9",fontSize:12,letterSpacing:"0.1em"}}>{err?"⚠ COULD NOT LOAD servicedata.json":"◆ LOADING DEPARTMENT PULSE…"}</div>
    </div>);
  }

  const BLUE="#5BA4E6",GREEN="#22c55e",GOLD="#F5B324",PURP="#a78bfa",RED="#E63946";
  // ── render-safety: coerce every value to a primitive before it ever hits JSX ──
  const numOr0=v=>(typeof v==="number"&&isFinite(v))?v:0;
  const str=v=>(v==null?"":String(v));
  const fmt=v=>{ v=numOr0(v); const av=Math.abs(v); return av>=1000000?"$"+(v/1000000).toFixed(2)+"M":av>=1000?"$"+Math.round(v/1000).toLocaleString()+"k":"$"+Math.round(v); };
  const fmtFull=v=>"$"+Math.round(numOr0(v)).toLocaleString();
  const fmtPct=v=>numOr0(v).toFixed(1)+"%";

  const WINS=[["today","TODAY"],["wtd","WTD"],["mtd","MTD"],["ytd","YTD"]];
  const W = (d[win] && typeof d[win]==="object" && !Array.isArray(d[win])) ? d[win] : {};
  const techRows = Array.isArray(d.techs && d.techs[win]) ? d.techs[win] : [];
  const board = (d.board && typeof d.board==="object") ? d.board : {};
  const monthly = Array.isArray(d.monthly) ? d.monthly : [];
  const revBU = (W.revenueBU && typeof W.revenueBU==="object" && !Array.isArray(W.revenueBU)) ? W.revenueBU : {};

  const updatedMs = d.updated ? Date.parse(d.updated) : null;
  const ageMin = (updatedMs && !isNaN(updatedMs)) ? Math.round((now-updatedMs)/60000) : null;
  const stale = ageMin!=null && ageMin>120;
  let dateStr="";
  try{ dateStr = updatedMs?new Date(updatedMs).toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"}):""; }catch(e){ dateStr=""; }

  const memPct = W.membershipConv!=null ? fmtPct(W.membershipConv) : "—";
  const memSub = (W.membershipsSold!=null && W.membershipOpps!=null) ? (numOr0(W.membershipsSold)+" / "+numOr0(W.membershipOpps)+" opps") : "";

  const offerPct = W.membershipOfferRate!=null ? fmtPct(W.membershipOfferRate) : "—";
  const offerSub = (W.membershipOffered!=null && W.membershipOfferJobs!=null) ? (numOr0(W.membershipOffered)+" / "+numOr0(W.membershipOfferJobs)+" calls offered") : "today/WTD only";
  const offerColor = v=>v==null?"#7a8fa0":(v>=90?"#4ADE80":(v>=70?GOLD:"#E63946"));

  // dept avg options built per opportunity (weighted by opps) — 4-6 is the standard
  const oppN=techRows.reduce((a,r)=>a+((r.optionsPerOpp||0)*(r.opps||0)),0);
  const oppD=techRows.reduce((a,r)=>a+(r.opps||0),0);
  const avgOpo=oppD?oppN/oppD:null;
  const opoColor=avgOpo==null?"#7a8fa0":(avgOpo>=4?"#4ADE80":(avgOpo>=3?GOLD:"#E63946"));

  const kpis=[
    ["CLOSE RATE",fmtPct(W.closeRate),GREEN,(W.converted!=null&&W.opps!=null)?(numOr0(W.converted)+"/"+numOr0(W.opps)+" opps"):""],
    ["AVG OPTIONS / OPP",avgOpo!=null?avgOpo.toFixed(2):"—",opoColor,oppD?(oppD+" opps · target 4-6"):"target 4-6"],
    ["AVG SALE",fmtFull(W.avgSale),BLUE,""],
    ["AVG TICKET",fmtFull(W.avgTicket),BLUE,(W.jobs!=null?numOr0(W.jobs)+" jobs":"")],
    ["SALES",fmtFull(W.sales),GOLD,W.salesIsApprox?"approx (invoice lag)":"$ sold"],
    ["REVENUE",fmtFull(W.revenue),"#4ADE80","$ invoiced"],
    ["MEMBERSHIP %",memPct,PURP,memSub],
    ["MEMBERSHIP OFFER %",offerPct,offerColor(W.membershipOfferRate),offerSub],
    ["LEADS SET",str(numOr0(W.leadsSet)),"#f5c518","turnovers"],
  ];

  // BY TECH — sort by sales desc
  const techSorted = techRows.slice().sort((a,b)=>numOr0(b.sales)-numOr0(a.sales));
  const memCell=t=>{
    const sold=numOr0(t.membershipsSold), opps=numOr0(t.membershipOpps);
    const pct = opps ? Math.round((sold/opps)*1000)/10 : 0;
    return sold+"/"+opps+" ("+pct.toFixed(1)+"%)";
  };
  const offerCell=t=> t.membershipOfferRate!=null ? fmtPct(t.membershipOfferRate) : "—";

  // BU cards from window.revenueBU — only revenue is genuinely split by BU in this feed;
  // sales/close-rate/avg-sale/opps below the header line are department totals (not BU-split),
  // labeled as such rather than fabricated.
  const buEntries = Object.entries(revBU);
  const buTotal = buEntries.reduce((a,[,v])=>a+numOr0(v),0);
  const buLabel=k=>{ const s=str(k); const p=s.split(" - "); return (p[1]||s).toUpperCase(); };
  const buColor=k=>str(k).toLowerCase().includes("maint")?GREEN:BLUE;

  const sectionCard=(title,sub,body)=>(
    <div style={{padding:"14px 24px 0"}}><div className="liftCard" style={{background:"#131c30",border:"1px solid #1e2d47",borderRadius:16,padding:"16px 20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",flexWrap:"wrap",gap:6}}>
        <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>{title}</div>
        {sub&&<div style={{fontSize:9.5,color:"#6b7a99"}}>{sub}</div>}
      </div>{body}
    </div></div>);

  const chart1=()=>{
    if(!monthly.length) return <div style={{color:"#5d6fa8",fontSize:11,padding:"10px 4px"}}>No monthly data yet.</div>;
    const W_=760,H_=190,pL=46,pB=26,pT=18,pR=44,n=monthly.length;
    const mxRev=Math.max(1,...monthly.map(x=>numOr0(x.revenue)),...monthly.map(x=>numOr0(x.salesApprox)));
    const X=i=>pL+i*(W_-pL-pR)/Math.max(1,n-1);
    const Y=v=>pT+(1-Math.min(1,numOr0(v)/mxRev))*(H_-pT-pB);
    return (<svg viewBox={"0 0 "+W_+" "+H_} style={{width:"100%",height:"auto",overflow:"visible",marginTop:10}}>
      {[0,0.5,1].map((f,i)=>(<g key={i}><line x1={pL} y1={Y(mxRev*f)} x2={W_-pR} y2={Y(mxRev*f)} stroke="#1e2d47"/><text x={pL-5} y={Y(mxRev*f)+3} fontSize="8" fill="#4a5a70" textAnchor="end">{fmt(mxRev*f)}</text></g>))}
      {monthly.map((x,i)=>{ const bw=(W_-pL-pR)/n*0.5; const last=i===n-1; return (<g key={i}>
        <rect x={X(i)-bw/2} y={Y(x.revenue)} width={bw} height={(H_-pB)-Y(x.revenue)} rx="3" fill={last?"url(#pulsegrad)":"#2E78C7"} opacity={last?0.85:1}/>
        <text x={X(i)} y={H_-6} fontSize="8.5" fill={last?GOLD:"#7089ab"} textAnchor="middle">{str(x.month).slice(0,3)}{last?"*":""}</text>
      </g>);})}
      <defs><linearGradient id="pulsegrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={BLUE}/><stop offset="100%" stopColor="#2E78C7"/></linearGradient></defs>
      <path d={monthly.map((x,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(x.salesApprox).toFixed(1)).join(" ")} fill="none" stroke={GOLD} strokeWidth="2.2"/>
      {monthly.map((x,i)=>(<circle key={"s"+i} cx={X(i)} cy={Y(x.salesApprox)} r="2.6" fill={GOLD}/>))}
      <text x={W_-pR+6} y={pT+4} fontSize="8" fill={GOLD}>sales (approx)</text><text x={pL} y={pT-6} fontSize="8" fill={BLUE}>revenue</text>
    </svg>);
  };

  const chart2=()=>{
    if(!monthly.length) return <div style={{color:"#5d6fa8",fontSize:11,padding:"10px 4px"}}>No monthly data yet.</div>;
    const W_=760,H_=170,pL=40,pB=24,pT=16,pR=12,n=monthly.length;
    const X=i=>pL+i*(W_-pL-pR)/Math.max(1,n-1);
    const Y=v=>pT+(1-Math.max(0,Math.min(100,numOr0(v)))/100)*(H_-pT-pB);
    const line=key=>monthly.map((x,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(x[key]).toFixed(1)).join(" ");
    return (<svg viewBox={"0 0 "+W_+" "+H_} style={{width:"100%",height:"auto",overflow:"visible",marginTop:10}}>
      {[0,50,100].map((f,i)=>(<g key={i}><line x1={pL} y1={Y(f)} x2={W_-pR} y2={Y(f)} stroke="#1e2d47"/><text x={pL-5} y={Y(f)+3} fontSize="8" fill="#4a5a70" textAnchor="end">{f}%</text></g>))}
      <path d={line("closeRate")} fill="none" stroke={GREEN} strokeWidth="2.2"/>
      <path d={line("membershipConv")} fill="none" stroke={PURP} strokeWidth="2.2"/>
      {monthly.map((x,i)=>(<g key={i}>
        <circle cx={X(i)} cy={Y(x.closeRate)} r="2.6" fill={GREEN}/>
        <circle cx={X(i)} cy={Y(x.membershipConv)} r="2.6" fill={PURP}/>
        <text x={X(i)} y={H_-6} fontSize="8.5" fill="#7089ab" textAnchor="middle">{str(x.month).slice(0,3)}</text>
      </g>))}
      <text x={W_-pR+6} y={pT+4} fontSize="8" fill={GREEN}>close %</text><text x={pL} y={pT-6} fontSize="8" fill={PURP}>memb conv %</text>
    </svg>);
  };

  return (
    <div className="lf2-wrap riseIn">
      <div className="lf2-head">
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div className="lf2-logo">S</div>
          <div>
            <div className="lf2-title">Department Pulse — {dateStr||"—"} · live</div>
            <div className="lf2-subtl">HVAC SERVICE · {WINS.find(w=>w[0]===win)[1]} window</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <div className="lf2-bus" style={{padding:0}}>
            {WINS.map(([k,l])=>(<button key={k} className={"lf2-bu"+(win===k?" on":"")} onClick={()=>setWin(k)}>{l}</button>))}
          </div>
          <div style={{background:"rgba(91,164,230,.1)",border:"1px solid #5BA4E655",color:"#5BA4E6",borderRadius:6,padding:"5px 12px",fontWeight:700,fontSize:10,letterSpacing:".14em"}}>STAGING SNAPSHOT</div>
          {stale
            ? <div className="lf2-chip-stale">⚠ UPDATED {ageMin}M AGO</div>
            : <div className="lf2-chip-live"><span className="lf2-dot"/>updated {ageMin!=null?ageMin+"m ago":"—"}</div>}
          {onClassic && <button onClick={onClassic} style={{background:"transparent",border:"1px solid #1e2d47",color:"#6b7a99",borderRadius:6,padding:"5px 12px",fontFamily:"inherit",fontSize:9.5,fontWeight:700,letterSpacing:".1em",cursor:"pointer"}}>CLASSIC VIEW →</button>}
        </div>
      </div>

      <div className="lf2-kpis">
        {kpis.map(([l,v,c,s])=>(<div className="lf2-kpi" key={l}><div className="l">{l}</div><div className="v" style={{color:c}}>{v}</div>{s?<div className="s">{s}</div>:null}</div>))}
      </div>

      <div style={{padding:"14px 24px 0",display:"flex",gap:12,flexWrap:"wrap"}}>
        <MonthPaceCard budget={d.budget} mtdRevenue={d.mtd && d.mtd.revenue}/>
      </div>

      <div style={{padding:"14px 24px 0",display:"flex",gap:12,flexWrap:"wrap"}}>
        {[["MAINTENANCE ON BOARD",numOr0(board.maintenanceOnBoard),BLUE],["MAINTENANCE RAN",numOr0(board.maintenanceRan),GREEN],["DEMAND ON BOARD",numOr0(board.demandOnBoard),GOLD],["DEMAND RAN",numOr0(board.demandRan),GREEN]].map(([l,v,c])=>(
          <div key={l} className="liftCard" style={{flex:"1 1 150px",background:"#131c30",border:"1px solid #1e2d47",borderLeft:"3px solid "+c,borderRadius:13,padding:"10px 16px"}}>
            <div style={{fontSize:9,color:"#7089ab",letterSpacing:"0.1em",fontWeight:700}}>{l}</div>
            <div style={{fontSize:20,fontWeight:900,color:c,marginTop:3}}>{v}</div>
          </div>))}
      </div>

      {sectionCard("Business Units","revenue split · other metrics are department totals, not yet BU-split in the feed",
        <div style={{display:"flex",gap:12,flexWrap:"wrap",marginTop:10}}>
          {buEntries.length ? buEntries.map(([k,v])=>{
            const pct = buTotal ? Math.round((numOr0(v)/buTotal)*1000)/10 : 0;
            const c=buColor(k);
            return (<div key={k} className="liftCard" style={{flex:"1 1 220px",background:"linear-gradient(160deg,#131c30,#0e1626)",border:"1px solid #1e2d47",borderRadius:14,padding:"14px 18px"}}>
              <div style={{fontSize:10,letterSpacing:"0.14em",color:c,fontWeight:800}}>{buLabel(k)}</div>
              <div style={{fontSize:26,fontWeight:900,color:"#fff",marginTop:4}}>{fmtFull(v)}</div>
              <div style={{fontSize:9.5,color:"#6b7a99",marginTop:3}}>{pct}% of revenue · {WINS.find(w=>w[0]===win)[1]}</div>
              <div style={{fontSize:9,color:"#6b7a99",marginTop:8,paddingTop:8,borderTop:"1px solid #1e2d47"}}>Dept sales {fmtFull(W.sales)} · close {fmtPct(W.closeRate)} · opps {numOr0(W.opps)}</div>
            </div>);
          }) : <div style={{color:"#5d6fa8",fontSize:11}}>No BU revenue split in this window.</div>}
        </div>)}

      {sectionCard("By Tech · "+WINS.find(w=>w[0]===win)[1],techSorted.length+" reps · sorted by sales",
        techSorted.length ? (
          <div style={{overflowX:"auto",marginTop:10}}>
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:820}}>
              <thead><tr>
                {["TECH","TEAM","OPPS","CLOSE RATE","AVG SALE","SALES","MEM","OFFER %","LEADS SET","REVENUE","JOBS","AVG TICKET"].map((h,i)=>(
                  <th key={h} style={{padding:"8px",fontSize:9,color:"#9fb3cc",fontWeight:700,textAlign:i<2?"left":"right",borderBottom:"2px solid #1e2d47",whiteSpace:"nowrap"}}>{h}</th>))}
              </tr></thead>
              <tbody>
                {techSorted.map((t,i)=>(
                  <tr key={str(t.name)+i} style={i<3?{background:"rgba(245,195,24,.06)"}:null}>
                    <td style={{padding:"6px 8px",fontSize:11,color:"#e6eefb",fontWeight:i<3?800:500,whiteSpace:"nowrap"}}>{i<3?["🥇 ","🥈 ","🥉 "][i]:""}{str(t.name)||"—"}</td>
                    <td style={{padding:"6px 8px",fontSize:11,color:"#9fb3cc"}}>{str(t.team)||"—"}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:"#e6eefb"}}>{numOr0(t.opps)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:GREEN,fontWeight:700}}>{fmtPct(t.closeRate)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:"#e6eefb"}}>{fmtFull(t.avgSale)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:GOLD,fontWeight:800}}>{fmtFull(t.sales)}</td>
                    <td style={{padding:"6px 8px",fontSize:10.5,textAlign:"right",color:PURP}}>{memCell(t)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:offerColor(t.membershipOfferRate),fontWeight:700}}>{offerCell(t)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:"#e6eefb"}}>{numOr0(t.leadsSet)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:"#4ADE80"}}>{fmtFull(t.revenue)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:"#e6eefb"}}>{numOr0(t.jobs)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:"#e6eefb"}}>{fmtFull(t.avgTicket)}</td>
                  </tr>))}
              </tbody>
            </table>
          </div>
        ) : <div style={{color:"#5d6fa8",fontSize:11,padding:"10px 4px"}}>No tech activity in this window yet.</div>)}

      {sectionCard("Sales vs Revenue by Month","bars = completed revenue · line = approx sales · *current month partial",chart1())}
      {sectionCard("Close Rate & Membership Conversion by Month","opportunity close % vs membership conversion %",chart2())}
    </div>
  );
}

function ServiceWeeklyTab(){
  const [d,setD]=React.useState(null);
  const [err,setErr]=React.useState(false);
  const [selDay,setSelDay]=React.useState("total");

  const load=()=>{
    fetch("https://raw.githubusercontent.com/johnschwinghamer94-lab/sierra-ropp-dashboard/main/servicedata.json?_="+Date.now())
      .then(r=>{ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
      .then(j=>{ setD(j); setErr(false); })
      .catch(()=>setErr(true));
  };
  React.useEffect(()=>{ load(); const id=setInterval(load,120000); return ()=>clearInterval(id); },[]);

  if(!d){
    return (<div className="lf2-wrap riseIn" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"50vh"}}>
      <div style={{color:"#8fa3d9",fontSize:12,letterSpacing:"0.1em"}}>{err?"⚠ COULD NOT LOAD servicedata.json":"◆ LOADING WEEKLY VIEW…"}</div>
    </div>);
  }

  const BLUE="#5BA4E6",GREEN="#22c55e",GOLD="#F5B324",PURP="#a78bfa",RED="#E63946";
  const numOr0=v=>(typeof v==="number"&&isFinite(v))?v:0;
  const str=v=>(v==null?"":String(v));
  const fmt=v=>{ v=numOr0(v); const av=Math.abs(v); return av>=1000000?"$"+(v/1000000).toFixed(2)+"M":av>=1000?"$"+Math.round(v/1000).toLocaleString()+"k":"$"+Math.round(v); };
  const fmtFull=v=>"$"+Math.round(numOr0(v)).toLocaleString();
  const fmtPct=v=>numOr0(v).toFixed(1)+"%";
  const firstName=n=>{ const s=str(n).trim(); return s?s.split(" ")[0]:"—"; };

  const wtd = (d.wtd && typeof d.wtd==="object" && !Array.isArray(d.wtd)) ? d.wtd : {};
  const weekly = Array.isArray(d.weekly) ? d.weekly : [];
  const curWeek = weekly.length ? weekly[weekly.length-1] : null;
  const weekLabel = curWeek ? str(curWeek.label) : "This Week";

  const tdRaw = (d.techDaily && typeof d.techDaily==="object" && !Array.isArray(d.techDaily)) ? d.techDaily : {};
  const days = Array.isArray(tdRaw._days) ? tdRaw._days : [];
  const techEntries = Object.keys(tdRaw).filter(k=>k!=="_days").map(name=>({name, rows:(tdRaw[name] && typeof tdRaw[name]==="object")?tdRaw[name]:{}}));
  const elapsedDays = Math.max(1, days.length);

  const dayLabel=iso=>{ try{ const dt=new Date(iso+"T00:00:00"); return dt.toLocaleDateString("en-US",{weekday:"short"}); }catch(e){ return str(iso); } };

  const runRate = numOr0(wtd.sales) / elapsedDays * 7;

  const kpis=[
    ["WTD SALES", fmtFull(wtd.sales), GOLD, "N of 7 days reported: "+days.length+"/7"],
    ["CLOSE RATE", fmtPct(wtd.closeRate), GREEN, (wtd.converted!=null&&wtd.opps!=null)?(numOr0(wtd.converted)+"/"+numOr0(wtd.opps)+" opps"):""],
    ["AVG SALE", fmtFull(wtd.avgSale), BLUE, ""],
    ["SALES OPP", str(numOr0(wtd.opps)), BLUE, "opportunities WTD"],
    ["MEM SOLD", str(numOr0(wtd.membershipsSold)), PURP, wtd.membershipConv!=null?fmtPct(wtd.membershipConv)+" conv":""],
    ["RUN-RATE PROJECTION", fmtFull(runRate), "#4ADE80", "If Pace Holds All Week"],
  ];

  // ── daily sales progression: sum sales across techs per day ──
  const dailyTotals = days.map(day=>({
    day,
    sales: techEntries.reduce((a,t)=>a+numOr0(t.rows[day] && t.rows[day].sales),0),
  }));

  const dailyChart=()=>{
    if(!dailyTotals.length) return <div style={{color:"#5d6fa8",fontSize:11,padding:"10px 4px"}}>No days reported yet this week.</div>;
    const W_=760,H_=190,pL=46,pB=26,pT=18,pR=16,n=dailyTotals.length;
    const mx=Math.max(1,...dailyTotals.map(x=>x.sales));
    const X=i=>pL+i*(W_-pL-pR)/Math.max(1,n);
    const bw=(W_-pL-pR)/n*0.55;
    const Y=v=>pT+(1-Math.min(1,v/mx))*(H_-pT-pB);
    return (<svg viewBox={"0 0 "+W_+" "+H_} style={{width:"100%",height:"auto",overflow:"visible",marginTop:10}}>
      {[0,0.5,1].map((f,i)=>(<g key={i}><line x1={pL} y1={Y(mx*f)} x2={W_-pR} y2={Y(mx*f)} stroke="#1e2d47"/><text x={pL-5} y={Y(mx*f)+3} fontSize="8" fill="#4a5a70" textAnchor="end">{fmt(mx*f)}</text></g>))}
      {dailyTotals.map((x,i)=>{ const last=i===n-1; const cx=X(i)+bw/2+((W_-pL-pR)/n-bw)/2; return (<g key={i}>
        <rect x={cx-bw/2} y={Y(x.sales)} width={bw} height={(H_-pB)-Y(x.sales)} rx="3" fill={last?"url(#wkgrad)":"#2E78C7"} opacity={last?0.9:1}/>
        <text x={cx} y={Y(x.sales)-6} fontSize="8.5" fontWeight="700" fill={BLUE} textAnchor="middle">{fmt(x.sales)}</text>
        <text x={cx} y={H_-6} fontSize="8.5" fill={last?GOLD:"#7089ab"} textAnchor="middle">{dayLabel(x.day)}{last?"*":""}</text>
      </g>);})}
      <defs><linearGradient id="wkgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#5BA4E6"/><stop offset="100%" stopColor="#2E78C7"/></linearGradient></defs>
    </svg>);
  };

  // ── leaders ──
  const salesLeaders = techEntries.map(t=>({name:t.name, sales:numOr0(t.rows.weekTotal && t.rows.weekTotal.sales)}))
    .sort((a,b)=>b.sales-a.sales).slice(0,10);
  const closeLeaders = techEntries.map(t=>{
      const wt = t.rows.weekTotal || {};
      return {name:t.name, opps:numOr0(wt.opps), closeRate:numOr0(wt.closeRate)};
    }).filter(t=>t.opps>0).sort((a,b)=>b.closeRate-a.closeRate).slice(0,10);

  const rankBar=(list,valKey,color,fmtVal,subFn)=>{
    const mx=Math.max(1,...list.map(c=>c[valKey]||0));
    return (<div style={{display:"flex",flexDirection:"column",gap:8,marginTop:10}}>
      {list.length ? list.map((c,i)=>(<div key={c.name+i} style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:20,fontSize:11,fontWeight:800,color:i<3?GOLD:"#6b7a99",textAlign:"right"}}>{i+1}</div>
        <div style={{width:120,fontSize:11,color:"#cfeede",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{i===0?"🥇 ":i===1?"🥈 ":i===2?"🥉 ":""}{firstName(c.name)}</div>
        <div style={{flex:1,background:"#0a1220",borderRadius:5,height:16,overflow:"hidden"}}><div style={{width:Math.max(2,(c[valKey]||0)/mx*100)+"%",height:"100%",borderRadius:5,background:"linear-gradient(90deg,"+color+","+color+"aa)",animation:"growW 1s ease both"}}/></div>
        <div style={{width:76,fontSize:11,fontWeight:800,color:color,textAlign:"right"}}>{fmtVal(c[valKey])}</div>
        {subFn&&<div style={{width:60,fontSize:9.5,color:"#9fb3cc",textAlign:"right"}}>{subFn(c)}</div>}
      </div>)) : <div style={{color:"#5d6fa8",fontSize:11}}>No data yet.</div>}
    </div>);
  };

  // ── day-by-day detail table ──
  const dayChips = [...days.map(day=>({key:day,label:dayLabel(day)})), {key:"total",label:"WEEK TOTAL"}];
  const detailRows = techEntries.map(t=>{
    const wt = t.rows.weekTotal || {};
    const sortVal = selDay==="total" ? numOr0(wt.sales) : numOr0(t.rows[selDay] && t.rows[selDay].sales);
    return { name:t.name, rows:t.rows, weekTotal:wt, sortVal };
  }).sort((a,b)=>b.sortVal-a.sortVal);

  const closeColor=r=>r>=40?GREEN:RED;

  return (
    <div className="lf2-wrap riseIn">
      <div className="lf2-head">
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div className="lf2-logo">S</div>
          <div>
            <div className="lf2-title">Week To Date — {weekLabel}</div>
            <div className="lf2-subtl">HVAC SERVICE · {days.length} of 7 days reported</div>
          </div>
        </div>
        <div style={{background:"rgba(91,164,230,.1)",border:"1px solid #5BA4E655",color:"#5BA4E6",borderRadius:6,padding:"5px 12px",fontWeight:700,fontSize:10,letterSpacing:".14em"}}>STAGING SNAPSHOT</div>
      </div>

      <div className="lf2-kpis">
        {kpis.map(([l,v,c,s])=>(<div className="lf2-kpi" key={l}><div className="l">{l}</div><div className="v" style={{color:c}}>{v}</div>{s?<div className="s">{s}</div>:null}</div>))}
      </div>

      <div style={{padding:"14px 24px 0"}}><div className="liftCard" style={{background:"#131c30",border:"1px solid #1e2d47",borderRadius:16,padding:"16px 20px"}}>
        <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>Daily Sales Progression</div>
        <div style={{fontSize:9.5,color:"#6b7a99"}}>department sales sold, summed across techs per elapsed day</div>
        {dailyChart()}
      </div></div>

      <div style={{padding:"14px 24px 0",display:"flex",gap:12,flexWrap:"wrap"}}>
        <div className="liftCard" style={{flex:"1 1 340px",background:"#131c30",border:"1px solid #1e2d47",borderRadius:16,padding:"16px 20px"}}>
          <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>Sales Leaders</div>
          <div style={{fontSize:9.5,color:"#6b7a99"}}>WTD sales sold, top 10</div>
          {rankBar(salesLeaders,"sales",GOLD,v=>fmtFull(v))}
        </div>
        <div className="liftCard" style={{flex:"1 1 340px",background:"#131c30",border:"1px solid #1e2d47",borderRadius:16,padding:"16px 20px"}}>
          <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>Close Rate Leaders</div>
          <div style={{fontSize:9.5,color:"#6b7a99"}}>WTD opp close %, top 10 (opps &gt; 0)</div>
          {rankBar(closeLeaders,"closeRate",GREEN,v=>fmtPct(v),c=>numOr0(c.opps)+" opps")}
        </div>
      </div>

      <div style={{padding:"14px 24px 0"}}><div className="liftCard" style={{background:"#131c30",border:"1px solid #1e2d47",borderRadius:16,padding:"16px 20px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",flexWrap:"wrap",gap:6}}>
          <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>Tech Day-By-Day Detail</div>
          <div style={{fontSize:9.5,color:"#6b7a99"}}>{techEntries.length} techs · sorted by selected column</div>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:10}}>
          {dayChips.map(c=>(<button key={c.key} onClick={()=>setSelDay(c.key)} className={"lf2-bu"+(selDay===c.key?" on":"")}>{c.label}</button>))}
        </div>
        {detailRows.length ? (
          <div style={{overflowX:"auto",marginTop:12}}>
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:820}}>
              <thead><tr>
                <th style={{padding:"8px",fontSize:9,color:"#9fb3cc",fontWeight:700,textAlign:"right",borderBottom:"2px solid #1e2d47"}}>#</th>
                <th style={{padding:"8px",fontSize:9,color:"#9fb3cc",fontWeight:700,textAlign:"left",borderBottom:"2px solid #1e2d47"}}>TECH</th>
                {days.map(day=>(<th key={day} style={{padding:"8px",fontSize:9,color:"#9fb3cc",fontWeight:700,textAlign:"right",borderBottom:"2px solid #1e2d47",whiteSpace:"nowrap"}}>{dayLabel(day)}</th>))}
                <th style={{padding:"8px",fontSize:9,color:"#9fb3cc",fontWeight:700,textAlign:"right",borderBottom:"2px solid #1e2d47",whiteSpace:"nowrap"}}>WTD TOTAL</th>
                <th style={{padding:"8px",fontSize:9,color:"#9fb3cc",fontWeight:700,textAlign:"right",borderBottom:"2px solid #1e2d47",whiteSpace:"nowrap"}}>WTD CLOSE</th>
                <th style={{padding:"8px",fontSize:9,color:"#9fb3cc",fontWeight:700,textAlign:"right",borderBottom:"2px solid #1e2d47",whiteSpace:"nowrap"}}>MEM SOLD</th>
              </tr></thead>
              <tbody>
                {detailRows.map((t,i)=>{
                  const cr = numOr0(t.weekTotal.closeRate);
                  return (<tr key={t.name+i} style={i<3?{background:"rgba(245,195,24,.06)"}:null}>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:i<3?GOLD:"#6b7a99",fontWeight:800}}>{i+1}</td>
                    <td style={{padding:"6px 8px",fontSize:11,color:"#e6eefb",fontWeight:i<3?800:500,whiteSpace:"nowrap"}}>{i<3?["🥇 ","🥈 ","🥉 "][i]:""}{str(t.name)||"—"}</td>
                    {days.map(day=>{
                      const rec = t.rows[day];
                      const s = rec && rec.sales!=null ? numOr0(rec.sales) : null;
                      return (<td key={day} style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:"#e6eefb"}}>{rec ? fmtFull(s) : "–"}</td>);
                    })}
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:GOLD,fontWeight:800}}>{fmtFull(t.weekTotal.sales)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right"}}>
                      <span style={{padding:"2px 8px",borderRadius:5,fontWeight:800,fontSize:10.5,color:closeColor(cr),background:closeColor(cr)+"1a",border:"1px solid "+closeColor(cr)+"55"}}>{fmtPct(cr)}</span>
                    </td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:PURP}}>{numOr0(t.weekTotal.membershipsSold)}</td>
                  </tr>);
                })}
              </tbody>
            </table>
          </div>
        ) : <div style={{color:"#5d6fa8",fontSize:11,padding:"10px 4px"}}>No tech activity reported yet this week.</div>}
      </div></div>

      <div style={{padding:"14px 24px 0"}}><div className="liftCard" style={{background:"#131c30",border:"1px solid #1e2d47",borderRadius:16,padding:"16px 20px"}}>
        <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>Week Over Week</div>
        <div style={{fontSize:9.5,color:"#6b7a99"}}>sales sold vs revenue invoiced · last 9 weeks</div>
        {weekly.length>=2 ? (()=>{
          const W_=760,H_=210,pL=48,pB=30,pT=18,pR=16,n=weekly.length;
          const mx=Math.max(1,...weekly.map(x=>numOr0(x.sales)),...weekly.map(x=>numOr0(x.revenue)));
          const X=i=>pL+i*(W_-pL-pR)/Math.max(1,n-1);
          const Y=v=>pT+(1-Math.min(1,numOr0(v)/mx))*(H_-pT-pB);
          const lineSales = weekly.map((x,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(x.sales).toFixed(1)).join(" ");
          const lineRev = weekly.map((x,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(x.revenue).toFixed(1)).join(" ");
          const areaSales = lineSales+" L "+X(n-1).toFixed(1)+" "+(H_-pB)+" L "+pL+" "+(H_-pB)+" Z";
          return (<svg viewBox={"0 0 "+W_+" "+H_} style={{width:"100%",height:"auto",overflow:"visible",marginTop:10}}>
            <defs><linearGradient id="wowgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={GOLD} stopOpacity="0.28"/><stop offset="100%" stopColor={GOLD} stopOpacity="0"/></linearGradient></defs>
            {[0,0.5,1].map((f,i)=>(<g key={i}><line x1={pL} y1={Y(mx*f)} x2={W_-pR} y2={Y(mx*f)} stroke="#1e2d47"/><text x={pL-5} y={Y(mx*f)+3} fontSize="8" fill="#4a5a70" textAnchor="end">{fmt(mx*f)}</text></g>))}
            <path d={areaSales} fill="url(#wowgrad)"/>
            <path d={lineRev} fill="none" stroke={BLUE} strokeWidth="2.2"/>
            <path d={lineSales} fill="none" stroke={GOLD} strokeWidth="2.4"/>
            {weekly.map((x,i)=>{ const isCur=i===n-1; return (<g key={i}>
              <circle cx={X(i)} cy={Y(x.revenue)} r="2.6" fill={BLUE}/>
              <circle cx={X(i)} cy={Y(x.sales)} r={isCur?4:2.8} fill={isCur?"#4ADE80":GOLD}/>
              <text x={X(i)} y={Y(x.sales)-8} fontSize="8" fontWeight="700" fill={isCur?"#4ADE80":GOLD} textAnchor="middle">{fmt(x.sales)}{x.salesIsApprox?"*":""}</text>
              <text x={X(i)} y={H_-14} fontSize="8" fill={isCur?"#4ADE80":"#7089ab"} textAnchor="middle" transform={"rotate(0 "+X(i)+" "+(H_-14)+")"}>{str(x.label)}</text>
            </g>);})}
            <text x={W_-pR+6} y={pT+4} fontSize="8" fill={GOLD}>sales</text>
            <text x={pL} y={pT-6} fontSize="8" fill={BLUE}>revenue</text>
          </svg>);
        })() : <div style={{color:"#5d6fa8",fontSize:11,padding:"10px 4px"}}>Not enough weekly history yet.</div>}
        <div style={{fontSize:8.5,color:"#5d6fa8",marginTop:6}}>* past-week sales figures are report-approximated (invoice lag); the current week is exact.</div>
      </div></div>
    </div>
  );
}

// ═══ HXH — HOUR BY HOUR, PACE TO WIN — servicefeed.json `hours` + servicedata.json `budget` ══════
function ServiceHxhTab(){
  const [feed,setFeed]=React.useState(null);
  const [data,setData]=React.useState(null);
  const [err,setErr]=React.useState(false);
  const [now,setNow]=React.useState(Date.now());

  const load=()=>{
    Promise.all([
      fetch("https://raw.githubusercontent.com/johnschwinghamer94-lab/sierra-ropp-dashboard/main/servicefeed.json?_="+Date.now()).then(r=>{ if(!r.ok) throw new Error("http "+r.status); return r.json(); }),
      fetch("https://raw.githubusercontent.com/johnschwinghamer94-lab/sierra-ropp-dashboard/main/servicedata.json?_="+Date.now()).then(r=>{ if(!r.ok) throw new Error("http "+r.status); return r.json(); }),
    ]).then(([f,d])=>{ setFeed(f); setData(d); setErr(false); }).catch(()=>setErr(true));
  };
  React.useEffect(()=>{ load(); const id=setInterval(load,30000); const t=setInterval(()=>setNow(Date.now()),30000); return ()=>{clearInterval(id);clearInterval(t);}; },[]);

  if(!feed || !data){
    return (<div className="lf2-wrap riseIn" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"50vh"}}>
      <div style={{color:"#8fa3d9",fontSize:12,letterSpacing:"0.1em"}}>{err?"⚠ COULD NOT LOAD servicefeed.json / servicedata.json":"◆ LOADING HOUR BY HOUR…"}</div>
    </div>);
  }

  const BLUE="#5BA4E6",GREEN="#22c55e",GOLD="#F5B324",PURP="#a78bfa",RED="#E63946";
  const numOr0=v=>(typeof v==="number"&&isFinite(v))?v:0;
  const str=v=>(v==null?"":String(v));
  const fmt=v=>{ v=numOr0(v); const av=Math.abs(v); return av>=1000000?"$"+(v/1000000).toFixed(2)+"M":av>=1000?"$"+Math.round(v/1000).toLocaleString()+"k":"$"+Math.round(v); };
  const fmtFull=v=>"$"+Math.round(numOr0(v)).toLocaleString();

  const K = feed.kpis || {};
  const budget = (data.budget && typeof data.budget==="object") ? data.budget : {};
  const preMonth = !!budget.preMonth;
  const todayCommit = numOr0(budget.dailyRevTarget);
  const signedTotal = numOr0(K.signedTotal);
  const signedJobs = numOr0(K.signedJobs);

  // ── PT wall-clock hour (fractional), used for pace math ──
  let nowPT = 12;
  try{
    const parts = new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date(now));
    const hh = Number((parts.find(p=>p.type==="hour")||{}).value);
    const mm = Number((parts.find(p=>p.type==="minute")||{}).value);
    if(!isNaN(hh)) nowPT = hh + (isNaN(mm)?0:mm/60);
  }catch(e){}

  const DAY_START=8, DAY_END=20; // 8a–8p working day
  const elapsedFrac = Math.max(0, Math.min(1, (nowPT-DAY_START)/(DAY_END-DAY_START)));
  const expectedByNow = todayCommit * elapsedFrac;
  const paceDelta = signedTotal - expectedByNow;
  const remainingHours = nowPT<DAY_START ? (DAY_END-DAY_START) : Math.max(0, DAY_END-nowPT);
  const wonAlready = signedTotal >= todayCommit && todayCommit>0;
  const neededPerHr = wonAlready ? 0 : (remainingHours>0 ? Math.max(0,(todayCommit-signedTotal))/remainingHours : Math.max(0,todayCommit-signedTotal));

  // ── hours array: cumulative-by-end-of-hour snapshots ──
  const hoursRaw = Array.isArray(feed.hours) ? feed.hours.slice().sort((a,b)=>numOr0(a.h)-numOr0(b.h)) : [];
  const hasHours = hoursRaw.length>0;
  const CHART_START=7, CHART_END=21; // 7a–9p display window

  // build delta rows against the previous *present* snapshot (chart gaps allowed)
  const deltaRows = hoursRaw.map((row,i)=>{
    const prev = i>0 ? hoursRaw[i-1] : null;
    return {
      h: numOr0(row.h),
      signedTotal: numOr0(row.signedTotal),
      signedDelta: numOr0(row.signedTotal) - (prev?numOr0(prev.signedTotal):0),
      doneDelta: numOr0(row.done) - (prev?numOr0(prev.done):0),
      optsTotalDelta: numOr0(row.optsTotal) - (prev?numOr0(prev.optsTotal):0),
    };
  }).filter(r=>r.h>=CHART_START && r.h<=CHART_END);

  const hourLabel=h=>{ const hh=((h%12)||12); return hh+(h<12?"a":"p"); };

  const burnChart=()=>{
    if(!deltaRows.length) return null;
    const W_=780,H_=220,pL=48,pB=26,pT=18,pR=16;
    const n=(CHART_END-CHART_START)+1;
    const X=h=>pL+(h-CHART_START)*(W_-pL-pR)/Math.max(1,n-1);
    const mxBar=Math.max(1,...deltaRows.map(r=>r.signedDelta));
    const mxLine=Math.max(1,todayCommit,...deltaRows.map(r=>r.signedTotal));
    const mx=Math.max(mxBar,mxLine);
    const Y=v=>pT+(1-Math.min(1,Math.max(0,v)/mx))*(H_-pT-pB);
    const bw=(W_-pL-pR)/Math.max(1,n)*0.5;
    const linePath = deltaRows.map((r,i)=>(i?"L":"M")+X(r.h).toFixed(1)+" "+Y(r.signedTotal).toFixed(1)).join(" ");
    return (<svg viewBox={"0 0 "+W_+" "+H_} style={{width:"100%",height:"auto",overflow:"visible",marginTop:10}}>

      {todayCommit>0 && <text x={W_-pR} y={Y(todayCommit)-5} fontSize="8" fill={GOLD} textAnchor="end">daily commit {fmt(todayCommit)}</text>}
      {deltaRows.map((r,i)=>(<g key={i}>
        <rect x={X(r.h)-bw/2} y={Y(r.signedDelta)} width={bw} height={(H_-pB)-Y(r.signedDelta)} rx="3" fill="#2E78C7" opacity={0.85}/>
        {r.signedDelta>0 && <text x={X(r.h)} y={Y(r.signedDelta)-5} fontSize="7.5" fontWeight="700" fill={BLUE} textAnchor="middle">{fmt(r.signedDelta)}</text>}
      </g>))}

      {deltaRows.map((r,i)=>(<circle key={"c"+i} cx={X(r.h)} cy={Y(r.signedTotal)} r="3" fill="#4ADE80"/>))}
      {Array.from({length:n},(_,i)=>CHART_START+i).map((h,i)=>(<text key={i} x={X(h)} y={H_-6} fontSize="8.5" fill="#7089ab" textAnchor="middle">{hourLabel(h)}</text>))}

      <text x={pL+130} y={pT-6} fontSize="8" fill={BLUE}>signed $ / hour</text>
    </svg>);
  };

  const kpis=[

  return (
    <div className="lf2-wrap riseIn">
      <div className="lf2-head">
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div className="lf2-logo">S</div>

            <div className="lf2-title">Hour By Hour — Pace To Win</div>
            <div className="lf2-subtl">{str(feed.date)||new Date(now).toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})}</div>

        <div style={{background:"rgba(91,164,230,.1)",border:"1px solid #5BA4E655",color:"#5BA4E6",borderRadius:6,padding:"5px 12px",fontWeight:700,fontSize:10,letterSpacing:".14em"}}>STAGING SNAPSHOT</div>
      </div>

      <div className="lf2-kpis">
        {kpis.map(([l,v,c,s])=>(<div className="lf2-kpi" key={l}><div className="l">{l}</div><div className="v" style={{color:c}}>{v}</div>{s?<div className="s">{s}</div>:null}</div>))}
      </div>

      <div style={{padding:"14px 24px 0"}}><div className="liftCard" style={{background:"#131c30",border:"1px solid #1e2d47",borderRadius:16,padding:"16px 20px"}}>
        <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>Burn-Up — Signed $ vs Daily Commit</div>
        <div style={{fontSize:9.5,color:"#6b7a99"}}>bars = signed $ closed each hour · line = cumulative signed $ · dashed = daily commit target</div>
        {hasHours ? burnChart() : (
          <div style={{marginTop:10,background:"#0e1626",border:"1px dashed #22307a",borderRadius:12,padding:"28px 18px",textAlign:"center",color:"#5d6fa8",fontSize:12,letterSpacing:"0.04em"}}>
            Hourly capture begins with the next relay session — bars fill in as the day runs.

      {hasHours && (

          <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>Hourly Detail</div>
          <div style={{fontSize:9.5,color:"#6b7a99"}}>jobs done + options$ presented, per hour</div>

}

function BoardFillTrendSection({days,history}){
  const str=v=>(v==null?"":String(v));
  const now=Date.now();
  const trendFor=date=>{
    return (history||[]).filter(s=>s&&s.counts&&typeof s.counts[date]==="number")
      .map(s=>({t:Date.parse(s.ts),v:s.counts[date]}))
      .filter(p=>!isNaN(p.t)&&(now-p.t)<=48*3600*1000)
      .sort((a,b)=>a.t-b.t);
  };
  if(!history || !history.length){
    return (
      <div style={{padding:"0 24px 24px"}}>
        <div style={{fontSize:10.5,fontWeight:800,color:"#fff",marginBottom:6}}>BOARD FILL TREND</div>
        <div style={{fontSize:10,color:"#6b7a99"}}>Snapshot history not published yet.</div>
      </div>
    );
  }
  return (
    <div style={{padding:"0 24px 24px"}}>
      <div style={{fontSize:10.5,fontWeight:800,color:"#fff",marginBottom:8}}>BOARD FILL TREND <span style={{fontSize:9,color:"#6b7a99",fontWeight:600}}>· last ~48h of snapshots</span></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,minmax(140px,1fr))",gap:10}}>
        {days.map((d,i)=>{
          const pts=trendFor(d.date);
          if(pts.length<2){
            return (<div key={i} className="liftCard" style={{background:"#131c30",border:"1px solid #1e2d47",borderRadius:10,padding:"8px 10px"}}>
              <div style={{fontSize:9.5,fontWeight:700,color:"#9fb3cc"}}>{str(d.label)||str(d.date)}</div>
              <div style={{fontSize:9,color:"#5d6fa8",marginTop:4}}>not enough history yet</div>
            </div>);
          }
          const first=pts[0].v,last=pts[pts.length-1].v,delta=last-first;
          const mx=Math.max(1,...pts.map(p=>p.v)),mn=Math.min(...pts.map(p=>p.v));
          const Wsp=110,Hsp=24;
          const X=j=>pts.length>1?(j/(pts.length-1))*Wsp:0;
          const Y=v=>mx>mn?Hsp-((v-mn)/(mx-mn))*Hsp:Hsp/2;
          const path=pts.map((p,j)=>(j?"L":"M")+X(j).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
          const dCol=delta>0?"#4ADE80":delta<0?"#E63946":"#6b7a99";
          return (
            <div key={i} className="liftCard" style={{background:"#131c30",border:"1px solid #1e2d47",borderRadius:10,padding:"8px 10px"}}>
              <div style={{fontSize:9.5,fontWeight:700,color:"#9fb3cc"}}>{str(d.label)||str(d.date)}</div>
              <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
                <svg viewBox={"0 0 "+Wsp+" "+Hsp} width={Wsp} height={Hsp} style={{flexShrink:0}}><path d={path} fill="none" stroke="#5BA4E6" strokeWidth="1.6"/></svg>
                <span style={{fontSize:9,fontWeight:800,color:dCol}}>{delta>0?"+":""}{delta} today</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ServiceCallsTab(){
  const [data,setData]=React.useState(null);
  const [err,setErr]=React.useState(false);
  const [now,setNow]=React.useState(Date.now());
  const [history,setHistory]=React.useState(null);
  const agingRef=React.useRef(null);
  if(agingRef.current===null){
    try{ agingRef.current = JSON.parse(sessionStorage.getItem("svc_unassigned_hist")||"{}"); }catch(e){ agingRef.current={}; }
  }

  const load=()=>{
    fetch("https://raw.githubusercontent.com/johnschwinghamer94-lab/sierra-ropp-dashboard/main/servicecalls.json?_="+Date.now())
      .then(r=>{ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
      .then(j=>{ setData(j); setErr(false); })
      .catch(()=>{ setErr(true); });
    fetch("https://raw.githubusercontent.com/johnschwinghamer94-lab/sierra-ropp-dashboard/main/servicecalls_history.json?_="+Date.now())
      .then(r=>{ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
      .then(j=>{ setHistory(Array.isArray(j)?j:null); })
      .catch(()=>{ setHistory(null); });
  };
  React.useEffect(()=>{ load(); const id=setInterval(load,120000); const t=setInterval(()=>setNow(Date.now()),30000); return ()=>{clearInterval(id);clearInterval(t);}; },[]);

  const str=v=>(v==null?"":String(v));
  const numOr0=v=>(typeof v==="number"&&isFinite(v))?v:0;
  const trunc=(s,n)=>{ s=str(s); return s.length>n?s.slice(0,n-1)+"…":s; };

  const days = (data && Array.isArray(data.days)) ? data.days.slice(0,5) : [];

  // browser-session aging tracker: servicecalls_history.json only stores booked
  // totals per day, not per-day unassigned counts, so "aging" (unassigned>0 for
  // 3+ consecutive polls) is tracked client-side across this tab's own 2-min
  // poll cycle and cached in sessionStorage so it survives a same-tab refresh.
  React.useEffect(()=>{
    if(!days.length) return;
    const rec = agingRef.current;
    days.forEach(d=>{
      const arr = rec[d.date] || [];
      arr.push(numOr0(d.unassigned));
      rec[d.date] = arr.slice(-5);
    });
    try{ sessionStorage.setItem("svc_unassigned_hist", JSON.stringify(rec)); }catch(e){}
  },[data]);
  const isAging=date=>{ const arr=(agingRef.current&&agingRef.current[date])||[]; if(arr.length<3) return false; return arr.slice(-3).every(v=>v>0); };

  if(!data || !days.length){
    return (<div className="lf2-wrap riseIn" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"50vh"}}>
      <div style={{color:"#8fa3d9",fontSize:12,letterSpacing:"0.06em",textAlign:"center",maxWidth:440,lineHeight:1.6}}>
        {err ? "Calls board data arrives with the next engine landing — check back shortly." : "◆ LOADING CALLS BOARD…"}
      </div>
    </div>);
  }

  const ageMin = data.generated ? Math.max(0, Math.round((now-new Date(data.generated).getTime())/60000)) : null;
  const stale = ageMin!=null && ageMin>10;
  const BLUE="#5BA4E6",GREEN="#22c55e",GOLD="#F5B324",AMBER="#F5B324";

  return (
    <div className="lf2-wrap riseIn">
      <div className="lf2-head">
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div className="lf2-logo">S</div>
          <div>
            <div className="lf2-title">📞 Calls Board — Next 5 Days</div>
            <div className="lf2-subtl">Booked appointments by tech · demand + maintenance</div>
          </div>
        </div>
        {stale
          ? <div className="lf2-chip-stale">⚠ UPDATED {ageMin}M AGO · STAGING SNAPSHOT</div>
          : <div className="lf2-chip-live"><span className="lf2-dot"/>updated {ageMin!=null?ageMin+"m ago":"—"}</div>}
      </div>

      <div style={{padding:"14px 24px 24px",display:"grid",gridTemplateColumns:"repeat(5,minmax(230px,1fr))",gap:12,overflowX:"auto"}}>
        {days.map((d,di)=>{
          const techs = Array.isArray(d.techs) ? d.techs : [];
          const unassigned = numOr0(d.unassigned);
          return (
          <div key={di} className="liftCard" style={{background:"#131c30",border:"1px solid #1e2d47",borderRadius:14,padding:"12px 12px 14px",minWidth:230,display:"flex",flexDirection:"column"}}>
            <div style={{fontSize:12,fontWeight:800,color:"#fff",letterSpacing:".04em"}}>{str(d.label)||str(d.date)}</div>
            <div style={{fontSize:19,fontWeight:900,color:GOLD,marginTop:2}}>{numOr0(d.total)}<span style={{fontSize:9,fontWeight:700,color:"#7089ab",marginLeft:5}}>BOOKED</span></div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
              <span style={{background:"rgba(91,164,230,.12)",border:"1px solid #5BA4E655",color:BLUE,borderRadius:6,padding:"3px 8px",fontWeight:700,fontSize:9.5}}>⚡ {numOr0(d.demand)} DEMAND</span>
              <span style={{background:"rgba(34,197,94,.12)",border:"1px solid #22c55e55",color:GREEN,borderRadius:6,padding:"3px 8px",fontWeight:700,fontSize:9.5}}>🔧 {numOr0(d.maintenance)} MAINT</span>
              {unassigned>0 && <span style={{background:"rgba(245,179,36,.14)",border:"1px solid #F5B32455",color:AMBER,borderRadius:6,padding:"3px 8px",fontWeight:800,fontSize:9.5}}>⚠ {unassigned} UNASSIGNED</span>}
              {unassigned>0 && isAging(d.date) && <span title="unassigned for 3+ consecutive checks" style={{background:"rgba(230,57,70,.14)",border:"1px solid #E6394655",color:"#ff7b86",borderRadius:6,padding:"3px 8px",fontWeight:800,fontSize:9.5}}>⚠ AGING</span>}
            </div>

            <div style={{marginTop:10,maxHeight:"65vh",overflowY:"auto",display:"flex",flexDirection:"column",gap:10,paddingRight:2}}>
              {techs.map((t,ti)=>{
                const appts = Array.isArray(t.appts) ? t.appts : [];
                const isUnassigned = str(t.name).toUpperCase()==="UNASSIGNED";
                const group = (
                  <div key={ti} style={isUnassigned?{border:"1px solid #F5B32455",background:"rgba(245,179,36,.06)",borderRadius:10,padding:"7px 8px"}:null}>
                    <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                      <span style={{fontSize:10.5,fontWeight:800,color:isUnassigned?AMBER:"#e6eefb"}}>{str(t.name)}</span>
                      {t.team ? <span style={{fontSize:8,fontWeight:700,color:"#7089ab",background:"#0e1626",border:"1px solid #1e2d47",borderRadius:5,padding:"1px 6px"}}>{str(t.team)}</span> : null}
                      <span style={{fontSize:8.5,color:"#5d6fa8"}}>{appts.length}</span>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:3,marginTop:4}}>
                      {appts.map((a,ai)=>(
                        <a key={ai} href={a.jobId?("https://go.servicetitan.com/#/Job/Index/"+a.jobId):undefined}
                          target="_blank" rel="noopener"
                          onClick={ev=>{ ev.stopPropagation(); if(!a.jobId) ev.preventDefault(); }}
                          style={{display:"flex",alignItems:"center",gap:6,textDecoration:"none",borderLeft:"3px solid "+(a.kind==="demand"?BLUE:a.kind==="maintenance"?GREEN:"#2a3a5a"),
                            background:"#0e1626",borderRadius:6,padding:"4px 7px",cursor:a.jobId?"pointer":"default"}}>
                          <span style={{fontSize:9.5,fontWeight:800,color:"#e6eefb",width:38,flexShrink:0}}>{str(a.time)}</span>
                          <span style={{fontSize:9.5,color:"#9fb3cc",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{trunc(a.customer,24)}</span>
                          {a.jobType && <span style={{fontSize:7.5,fontWeight:700,color:"#7089ab",background:"#131c30",border:"1px solid #1e2d47",borderRadius:4,padding:"1px 5px",whiteSpace:"nowrap"}}>{str(a.jobType)}</span>}
                        </a>
                      ))}
                    </div>
                  </div>
                );
                return group;
              })}
              {!techs.length && <div style={{fontSize:9.5,color:"#5d6fa8",padding:"6px 2px"}}>No appointments booked.</div>}
            </div>
          </div>);
        })}
      </div>

      <BoardFillTrendSection days={days} history={history}/>
    </div>
  );
}

    name,
    recorded:numOr0(v.recorded),
    eligible:numOr0(v.eligible),

function CoachingOutcomesPanel({outcomes,notes}){

  const rows=Array.isArray(outcomes)?outcomes:[];
  const notesArr=Array.isArray(notes)?notes:[];
  const verdictStyle=v=>{
    const k=str(v).toLowerCase();
    if(k==="improved") return {color:"#4ADE80",bg:"rgba(74,222,128,.12)",border:"#4ADE8055",label:"IMPROVED"};
    if(k==="declined") return {color:"#ff7b86",bg:"rgba(230,57,70,.12)",border:"#e6394655",label:"DECLINED"};
    if(k==="flat") return {color:"#9fb3cc",bg:"rgba(159,179,204,.1)",border:"#9fb3cc55",label:"FLAT"};
    if(k==="insufficient-data") return {color:"#6b7a99",bg:"rgba(107,122,153,.1)",border:"#6b7a9955",label:"INSUFFICIENT DATA",title:"Fewer than ~5 business days of data on one side of the plan"};
    if(k==="unmeasured") return {color:"#6b7a99",bg:"rgba(107,122,153,.1)",border:"#6b7a9955",label:"UNMEASURED",title:"No metric tracked for this plan yet"};
    return {color:"#9fb3cc",bg:"rgba(159,179,204,.1)",border:"#9fb3cc55",label:str(v).toUpperCase()||"—"};
  };
  const allInsufficient = rows.length>0 && rows.every(r=>{ const k=str(r.verdict).toLowerCase(); return k==="insufficient-data"||k==="unmeasured"; });

    <div style={{padding:"0 24px 24px"}}>

        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:640}}>
            <thead><tr>
              {["TECH","WHAT THEY WERE TOLD","METRIC","BEFORE → AFTER","Δ","VERDICT"].map(h=>(
                <th key={h} style={{padding:"6px 8px",fontSize:9,color:"#9fb3cc",fontWeight:700,textAlign:"left",borderBottom:"2px solid #1e2d47",whiteSpace:"nowrap"}}>{h}</th>))}
            </tr></thead>
            <tbody>
              {rows.map((r,i)=>{ const v=verdictStyle(r.verdict); return (
                <tr key={i} style={{borderTop:"1px solid #1e2d47"}}>
                  <td style={{padding:"6px 8px",fontSize:10.5,color:"#fff",fontWeight:700,whiteSpace:"nowrap"}}>{str(r.tech)}</td>
                  <td style={{padding:"6px 8px",fontSize:10,color:"#9fb3cc"}}>{trunc(r.focusText,70)}</td>
                  <td style={{padding:"6px 8px",fontSize:10,color:"#9fb3cc",whiteSpace:"nowrap"}}>{str(r.metric)}</td>
                  <td style={{padding:"6px 8px",fontSize:10,color:"#e6eefb",whiteSpace:"nowrap"}}>{str(r.before)} → {str(r.after)}</td>
                  <td style={{padding:"6px 8px",fontSize:10,fontWeight:700,color:v.color,whiteSpace:"nowrap"}}>{str(r.delta)}</td>
                  <td style={{padding:"6px 8px"}}><span title={v.title||""} style={{fontSize:8.5,fontWeight:800,letterSpacing:".04em",borderRadius:5,padding:"2px 7px",background:v.bg,border:"1px solid "+v.border,color:v.color}}>{v.label}</span></td>

            </tbody>
          </table>

  const bandClass=v=>"lf2-band b-"+String(v).toLowerCase().replace(/[^a-z]/g,"");

  const bandRank=v=>{ const k=String(v).toLowerCase().replace(/[^a-z]/g,""); return BAND_RANK.hasOwnProperty(k)?BAND_RANK[k]:2; };

  const ageTxt = ageMin==null ? "—" : (ageMin<60 ? ageMin+"m ago" : Math.round(ageMin/60)+"h ago");

  // worst-first: most failed critical flags first, tie-broken by weakest band (worse band = higher rank)
  const repsSorted = reps.slice().sort((a,b)=>{
    const failsA = a.critical ? Object.values(a.critical).filter(v=>v===false).length : 0;
    const failsB = b.critical ? Object.values(b.critical).filter(v=>v===false).length : 0;
    if(failsB!==failsA) return failsB-failsA;
    const worstA = a.bands ? Math.max(...Object.values(a.bands).map(bandRank)) : 0;
    const worstB = b.bands ? Math.max(...Object.values(b.bands).map(bandRank)) : 0;
    return worstB-worstA;
  });

  const critPills=[["expectations","EXPECTATIONS"],["options","4+ OPTIONS"],["membership","MEMBERSHIP"],["close","CLOSE ASK"]];
  const bandKeys=["welcome","diagnosis","options","close"];

  return (

          ))}
        </div>
      )}

      <div style={{padding:"14px 24px 24px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:14}}>
        {repsSorted.map((r,i)=>{
          const critical = (r.critical && typeof r.critical==="object") ? r.critical : {};
          const bands = (r.bands && typeof r.bands==="object") ? r.bands : {};
          // prefer the path the feed supplies; only reconstruct if it is missing
          const planHref = str(r.plan) || ("coaching/plans_service/"+date+"/"+planFile(r.name));
          return (

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8,flexWrap:"wrap"}}>
                <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>{str(r.name)}</div>
                <div style={{fontSize:9.5,color:"#7089ab"}}>{numOr0(r.calls)} call{numOr0(r.calls)===1?"":"s"} · <span style={{color:"#F5B324",fontWeight:800}}>{str(r.closeRate)}</span> close</div>
              </div>

              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {bandKeys.map(k=>bands[k]?(<span key={k} className={bandClass(bands[k])}>{k}: {bands[k]}</span>):null)}
              </div>

              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {critPills.map(([k,l])=>{
                  const ok = !!critical[k];
                  return (<span key={k} style={{fontSize:8.5,fontWeight:800,letterSpacing:".04em",borderRadius:5,padding:"2px 7px",

                })}
              </div>

              {r.headlineGap && (
                <div style={{fontSize:10.5,color:"#cfd9ee",lineHeight:1.5,background:"#0e1626",border:"1px solid #1e2d47",borderLeft:"3px solid #E63946",borderRadius:8,padding:"8px 10px"}}>{str(r.headlineGap)}</div>
              )}

              <a href={planHref} target="_blank" rel="noopener" style={{alignSelf:"flex-start",marginTop:2,fontSize:9.5,fontWeight:800,letterSpacing:".06em",color:"#5BA4E6",textDecoration:"none",border:"1px solid #5BA4E655",background:"rgba(91,164,230,.08)",borderRadius:6,padding:"5px 10px"}}>📄 OPEN PLAN</a>
            </div>

                    {techHasDelta && <td style={{padding:"6px 8px",fontSize:11,textAlign:"right"}}>{deltaChip(t.deltas.sales,false,false)}</td>}

// ── Confetti engine (triggered by React via window.__celebrate) ───────────────
(function(){
  window.__celebrate = function() {
    var canvas = document.getElementById('confetti-canvas') || document.createElement('canvas');
    canvas.id = 'confetti-canvas';
    document.body.appendChild(canvas);
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    var ctx = canvas.getContext('2d');
    var pieces = Array.from({length:120}, function() { return {
      x: Math.random()*canvas.width, y: -10,
      r: 4+Math.random()*6, vx: -2+Math.random()*4, vy: 3+Math.random()*5,
      color: ['#F5B324','#2E78C7','#4ADE80','#E63946','#a78bfa'][Math.floor(Math.random()*5)],
      rot: Math.random()*360, rspd: -3+Math.random()*6
    }; });
    var frame = 0;
    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      pieces.forEach(function(p) {
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle=p.color; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r); ctx.restore();
        p.x+=p.vx; p.y+=p.vy; p.rot+=p.rspd; p.vy+=0.07;
      });
      frame++;
      if(frame < 160) requestAnimationFrame(draw);
      else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.remove(); }
    }
    draw();
  };
})();

// ── Auto-refresh every 5 minutes so a wall/monitor display stays current ──
// Skips the reload while the Manage panel is open or a form field is focused,
// so an in-progress edit or rebuild is never lost; it retries a minute later.
(function () {
  var EVERY = 5 * 60 * 1000; // 5 minutes
  function busy() {
    if (window.__modalOpen) return true;
    var el = document.activeElement;
    return !!(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
  }
  function tick() {
    if (busy()) { setTimeout(tick, 60 * 1000); return; }
    window.location.reload();
  }
  setTimeout(tick, EVERY);
})();
</script>
