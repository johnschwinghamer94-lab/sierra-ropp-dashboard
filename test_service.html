<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sierra Service Command · TEST</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="engine.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#070b16;color:#eaf1fb;font-family:'Inter','Segoe UI',system-ui,sans-serif;min-height:100vh;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:#070b16;}
::-webkit-scrollbar-thumb{background:#1e2d47;border-radius:3px;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 8px currentColor;}50%{opacity:.4;box-shadow:0 0 2px currentColor;}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes drawArc{from{stroke-dashoffset:440;}to{stroke-dashoffset:0;}}
@keyframes growUp{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 3px currentColor);}50%{filter:drop-shadow(0 0 13px currentColor);}}
@keyframes growW{from{width:0;}}
/* ═══ TEST ENHANCEMENTS ═══════════════════════════════════════════════════ */
/* Sticky header */
.sticky-hdr{position:sticky;top:0;z-index:100;backdrop-filter:blur(14px);}
/* Animated number counter */
@keyframes numPop{0%{transform:translateY(6px);opacity:.3}100%{transform:translateY(0);opacity:1}}
.num-pop{display:inline-block;animation:numPop .35s cubic-bezier(.2,.7,.2,1) both;}
/* Last-updated badge */
.upd-badge{font-size:9px;color:#4ADE80;font-weight:700;letter-spacing:.1em;background:rgba(74,222,128,.10);
  padding:3px 9px;border-radius:20px;border:1px solid rgba(74,222,128,.3);animation:pulse 3s ease infinite;}
/* Tab count badge */
.tcnt{background:rgba(245,179,36,.18);color:#F5B324;border-radius:9px;padding:1px 5px;
  font-size:8px;font-weight:700;margin-left:3px;vertical-align:middle;}
/* Keyboard hint */
.kbd{background:#1e2d47;border:1px solid #2E78C7;color:#7089ab;border-radius:4px;
  padding:1px 5px;font-size:8px;font-family:monospace;display:inline-block;}
/* Tooltip host */
.tiphost{position:relative;cursor:help;}
.tiphost:hover .tipbubble{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
.tipbubble{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%) translateY(5px);
  background:#1a2740;border:1px solid #2E78C7;color:#eaf1fb;font-size:10px;line-height:1.5;
  padding:7px 11px;border-radius:9px;white-space:nowrap;z-index:300;opacity:0;
  transition:opacity .18s,transform .18s;pointer-events:none;max-width:220px;text-align:center;}
/* Projected month-end pill */
.proj-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
  padding:4px 10px;border-radius:20px;border:1px solid;letter-spacing:.04em;}
/* Tab content fade-in */
@keyframes tabFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.tab-fade{animation:tabFade .28s cubic-bezier(.2,.7,.2,1) both;}
/* Table row hover */
.trow{transition:background .12s ease;}
.trow:hover{background:rgba(46,120,199,.10)!important;}
/* Current hour highlight */
.cur-hour{background:rgba(245,179,36,.12)!important;border-left:3px solid #F5B324!important;}
/* KPI alert */
@keyframes alertPulse{0%,100%{opacity:1}50%{opacity:.65}}
.kpi-alert{animation:alertPulse 1.8s ease infinite;background:rgba(230,57,70,.15);border-bottom:1px solid #E63946aa;
  padding:7px 20px;font-size:10px;font-weight:700;color:#E63946;letter-spacing:.08em;display:flex;align-items:center;gap:10px;}
/* Perf badge */
.fire-badge{font-size:10px;margin-left:4px;}
/* Scroll-to-top btn */
#scr-top{position:fixed;bottom:28px;right:24px;z-index:500;background:#F5B324;color:#070b16;border:none;
  border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;display:none;align-items:center;
  justify-content:center;box-shadow:0 4px 18px rgba(245,179,36,.5);transition:transform .15s ease;}
#scr-top:hover{transform:scale(1.12);}
/* Projected MTD pill */
/* Countdown timer */
.countdown{font-size:9px;color:#2E78C7;font-weight:700;letter-spacing:.08em;
  background:rgba(46,120,199,.12);border:1px solid rgba(46,120,199,.3);
  padding:3px 9px;border-radius:20px;font-family:monospace;}
/* Kiosk mode */
.kiosk-btn{background:rgba(245,179,36,.1);border:1px solid #F5B32455;color:#F5B324;
  border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:10px;
  font-weight:700;letter-spacing:.06em;transition:all .15s;}
.kiosk-btn.active{background:#F5B324;color:#070b16;}
/* Refresh button */
.refresh-btn{background:rgba(46,120,199,.15);border:1px solid #2E78C755;color:#2E78C7;
  border-radius:8px;padding:6px 11px;cursor:pointer;font-family:inherit;font-size:12px;
  transition:all .15s;}
.refresh-btn:hover{background:#2E78C7;color:#fff;}
.refresh-btn.spinning{animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
/* KPI slider */
.kpi-slider-wrap{display:flex;align-items:center;gap:7px;font-size:9px;color:#7089ab;}
input[type=range].kpi-range{-webkit-appearance:none;width:80px;height:4px;
  background:linear-gradient(90deg,#E63946,#F5B324,#2E78C7);border-radius:2px;outline:none;cursor:pointer;}
input[type=range].kpi-range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:#F5B324;border:2px solid #070b16;cursor:pointer;}
/* Celebration */
@keyframes celebPop{0%{transform:scale(1)}30%{transform:scale(1.12)}60%{transform:scale(.97)}100%{transform:scale(1)}}
.celebrate{animation:celebPop .5s ease;}
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;}
/* Days left chip */
.days-left{font-size:9px;color:#7089ab;font-weight:600;background:rgba(255,255,255,.05);
  border:1px solid #1e2d47;padding:2px 8px;border-radius:12px;}
/* Gradient leaderboard bars */
.lb-bar{height:16px;border-radius:5px;animation:growW 1s ease both;transform-origin:left;}
/* CSV export btn */
.csv-btn{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:#4ADE80;
  border-radius:7px;padding:6px 13px;cursor:pointer;font-family:inherit;font-size:10px;
  font-weight:700;letter-spacing:.05em;transition:all .15s;}
.csv-btn:hover{background:#4ADE80;color:#070b16;}
/* TODAY sparkline overlay */
.today-spark{position:absolute;bottom:4px;left:8px;right:8px;opacity:.5;}
.proj-mtd{background:linear-gradient(135deg,rgba(46,120,199,.18),rgba(245,179,36,.08));border:1px solid #2E78C744;
  border-radius:12px;padding:10px 16px;min-width:160px;}
/* Tech filter input */
.tech-filter{background:#0e1626;border:1px solid #1e2d47;color:#eaf1fb;border-radius:8px;padding:7px 13px;
  font-family:inherit;font-size:11px;outline:none;width:220px;transition:border-color .15s;}
.tech-filter:focus{border-color:#2E78C7;}
/* Mobile responsive tweaks */
@media(max-width:640px){
  h1{font-size:16px!important;}
  .gauge-grid{grid-template-columns:1fr 1fr!important;}
  .ticker-bar{font-size:10px!important;}
  button[data-tab]{padding:6px 8px!important;font-size:9px!important;}
  /* KPI cards go 2-up and shrink to fit narrow screens */
  .kpi-card{min-width:0!important;flex:1 1 42%!important;padding:10px 8px!important;}
  .kpi-card>div:nth-child(2){font-size:19px!important;}
  /* Compact tables + let wide tables scroll horizontally inside their card */
  table{font-size:10px!important;}
  th,td{padding:6px 5px!important;}
  /* Full-width filter / search inputs */
  .tech-filter,.tab-search{width:100%!important;}
  /* Trim heavy section padding so content isn't squeezed */
  .sec-pad{padding-left:12px!important;padding-right:12px!important;}
}

/* ── Round 4 Global ─────────────────────────────────────────── */
tr.hov-row{transition:background .12s;}
tr.hov-row:hover td{background:#1a2540 !important;}
.hm-cell{position:relative;transition:background .2s;}
.medal-1{color:#FFD700;text-shadow:0 0 8px #FFD70088;font-size:14px;}
.medal-2{color:#C0C0C0;font-size:14px;}
.medal-3{color:#CD7F32;font-size:14px;}
@keyframes champGlow{0%,100%{box-shadow:0 0 0 transparent}50%{box-shadow:0 0 22px #F5B32466}}
.champion-row{animation:champGlow 2.5s ease-in-out infinite;}
.fire-badge{font-size:13px;animation:fireFlicker .7s alternate infinite;}
@keyframes fireFlicker{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.15) rotate(3deg)}}
.trend-up{color:#4ADE80;font-weight:800;font-size:11px;}
.trend-dn{color:#E63946;font-weight:800;font-size:11px;}
.trend-eq{color:#6b7a99;font-size:11px;}
.tab-search{background:#0a1220;border:1px solid #1e2d47;color:#fff;border-radius:8px;
  padding:6px 12px;font-family:inherit;font-size:11px;outline:none;transition:border .15s;width:180px;}
.tab-search:focus{border-color:#F5B324;}
.tab-search::placeholder{color:#4a5a70;}
.pace-ring{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);}
.scenario-bar{height:12px;border-radius:4px;animation:growW 1s ease both;}
.hm-great{background:rgba(46,120,199,.18) !important;}
.hm-good{background:rgba(245,179,36,.14) !important;}
.hm-bad{background:rgba(230,57,70,.14) !important;}
.spark-svg{overflow:visible;}
.eod-tile{background:linear-gradient(135deg,#0f1e38,#162849);border:1px solid #2E78C744;
  border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:4px;}
.beat-chip{background:rgba(74,222,128,.15);border:1px solid rgba(74,222,128,.3);
  color:#4ADE80;font-size:9px;font-weight:800;padding:2px 7px;border-radius:10px;}
.miss-chip{background:rgba(230,57,70,.15);border:1px solid rgba(230,57,70,.3);
  color:#E63946;font-size:9px;font-weight:800;padding:2px 7px;border-radius:10px;}
/* ─────────────────────────────────────────────────────────────── */
.riseIn{animation:riseIn .55s cubic-bezier(.2,.7,.2,1) both;}
.liftCard{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
.liftCard:hover{transform:translateY(-3px);box-shadow:0 10px 34px rgba(0,0,0,.45);border-color:#2E78C7 !important;}
.gridbg{background-image:linear-gradient(rgba(46,120,199,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(46,120,199,.05) 1px,transparent 1px);background-size:34px 34px;}
/* ═══ LIVE FEED TAB (borrowed lf2- visual language from index.html) ══════ */
.lf2-wrap{font-family:'Chakra Petch','Inter',sans-serif;min-height:70vh;background:radial-gradient(ellipse 80% 50% at 50% -10%,#122052 0%,#0a1024 55%,#070b1a 100%);padding:0 0 44px}
.lf2-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 22px;background:linear-gradient(90deg,#0b1230ee,#101b45ee);border-bottom:1px solid #22307a}
.lf2-logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#f5c518,#c79a0a);display:flex;align-items:center;justify-content:center;font-weight:900;color:#081020;font-size:20px;box-shadow:0 0 14px #f5c51833}
.lf2-title{font-size:15px;font-weight:700;letter-spacing:.14em;color:#fff;text-transform:uppercase}
.lf2-subtl{font-size:9px;letter-spacing:.3em;color:#f5c518;margin-top:2px;font-weight:600;text-transform:uppercase}
.lf2-chip-live{display:flex;align-items:center;gap:7px;background:#0d2b18;border:1px solid #35d07f66;border-radius:6px;padding:5px 13px;color:#4ade80;font-weight:700;font-size:10px;letter-spacing:.2em}
.lf2-chip-night{background:#101b30;border:1px solid #2E78C755;border-radius:6px;padding:5px 13px;color:#7fb3e8;font-weight:700;font-size:10px;letter-spacing:.14em}
.lf2-chip-stale{background:#2a0d12;border:1px solid #e63946;border-radius:6px;padding:5px 13px;color:#ff7b86;font-weight:700;font-size:10px;letter-spacing:.14em;animation:lf2Blink 1.2s infinite}
.lf2-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:lf2Pulse 1.6s infinite}
@keyframes lf2Pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
@keyframes lf2Blink{50%{opacity:.45}}
.lf2-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:16px 22px 4px}
.lf2-kpi{background:linear-gradient(180deg,#0d1638,#0a1130);border:1px solid #22307a;border-radius:10px;padding:12px 18px;box-shadow:inset 0 0 26px #101d5240}
.lf2-kpi .l{font-size:9px;letter-spacing:.24em;color:#8fa3d9;font-weight:600;text-transform:uppercase}
.lf2-kpi .v{font-size:27px;font-weight:700;color:#fff;margin-top:3px}
.lf2-kpi .s{font-size:9.5px;color:#5d6fa8;margin-top:2px;letter-spacing:.08em}
.lf2-bus{display:flex;gap:8px;padding:12px 22px 0;flex-wrap:wrap}
.lf2-bu{font-size:9.5px;font-weight:700;letter-spacing:.16em;padding:4px 14px;border-radius:5px;border:1px solid #22307a;color:#8fa3d9;cursor:pointer;background:#0a1130;text-transform:uppercase}
.lf2-bu.on{border-color:#f5c518;color:#f5c518;background:#f5c51811;box-shadow:0 0 10px #f5c51822}
.lf2-main{display:flex;gap:14px;padding:14px 22px;align-items:flex-start;flex-wrap:wrap}
.lf2-grid{flex:2.6 1 560px;min-width:300px;display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:12px}
.lf2-card{background:linear-gradient(180deg,#0e1a45,#0a1233);border:1px solid #243380;border-radius:10px;padding:11px 13px 10px;box-shadow:0 0 16px #060b2088;cursor:pointer;transition:transform .12s,border-color .12s;position:relative;overflow:hidden}
.lf2-card::after{content:"";position:absolute;top:0;left:-85%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-18deg);transition:left .55s ease;pointer-events:none;}
.lf2-card:hover::after{left:125%;}
.lf2-card:hover{transform:translateY(-2px);border-color:#f5c518aa}
.lf2-card.working{border-color:#f5c51866;box-shadow:0 0 18px #f5c51815}
.lf2-card.done{opacity:.78}
@keyframes lf2CardAlertPulse{0%,100%{border-color:#E63946;box-shadow:0 0 10px #E3394666}50%{border-color:#ff8c93;box-shadow:0 0 20px #E63946aa}}
.lf2-card.alert{border-color:#E63946!important;animation:lf2CardAlertPulse 2s ease-in-out infinite}
.lf2-alertrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.lf2-alertchip{font-size:8.5px;font-weight:800;letter-spacing:.06em;color:#ff8c93;background:rgba(230,57,70,.14);border:1px solid #E6394677;border-radius:4px;padding:2px 7px;white-space:nowrap}
@keyframes lf2GoldFlash{0%{border-color:#F5B324;box-shadow:0 0 6px #F5B32455}25%{border-color:#ffe08a;box-shadow:0 0 34px #F5B324dd,0 0 60px #F5B32488}100%{border-color:#F5B32499;box-shadow:0 0 10px #F5B32444}}
.lf2-card.goldFlash{animation:lf2GoldFlash 3s ease-out 1 both}
.lf2-card.goldSettled{border-color:#F5B32499!important;box-shadow:0 0 10px #F5B32444}
.lf2-signedchip{font-size:8.5px;font-weight:800;letter-spacing:.06em;color:#3a2c05;background:linear-gradient(90deg,#F5B324,#ffe08a);border-radius:4px;padding:2px 7px;white-space:nowrap;margin-left:6px}
.lf2-headalert{background:rgba(230,57,70,.14);border:1px solid #E6394677;color:#ff8c93;border-radius:6px;padding:5px 12px;font-weight:800;font-size:10px;letter-spacing:.08em;animation:lf2Blink 1.2s infinite}
@keyframes lf2AlarmFlash{0%,100%{background:rgba(230,57,70,0)}25%,75%{background:rgba(230,57,70,.38)}50%{background:rgba(230,57,70,.12)}}
@keyframes lf2TakeoverPulse{0%,100%{background:rgba(120,10,18,.97)}50%{background:rgba(198,24,36,.97)}}
.lf2-alarm-takeover{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:lf2TakeoverPulse 1.1s ease-in-out infinite;padding:24px;overflow-y:auto}
.lf2-alarm-title{font-size:30px;font-weight:900;color:#fff;letter-spacing:.12em;text-shadow:0 0 24px rgba(0,0,0,.5);animation:lf2Blink 1.2s infinite}
.lf2-alarm-list{display:flex;flex-direction:row;flex-wrap:wrap;gap:12px;justify-content:center;align-items:stretch;max-width:94vw;overflow:visible}
.lf2-alarm-item{background:rgba(0,0,0,.35);border:2px solid #fff3;border-radius:12px;padding:12px 22px;text-align:center;min-width:0;max-width:340px}
.lf2-alarm-tech{font-size:22px;font-weight:900;color:#fff}
.lf2-alarm-team{font-size:13px;font-weight:700;color:#ffd8db}
.lf2-alarm-cust{font-size:12px;color:#ffd8db;margin-top:2px}
.lf2-alarm-labels{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.lf2-alarm-label{background:#fff;color:#C61824;border-radius:7px;padding:4px 10px;font-weight:900;font-size:13px;letter-spacing:.05em}
.lf2-alarm-exit{background:#fff;color:#C61824;border:none;border-radius:12px;padding:14px 40px;font-size:18px;flex-shrink:0;font-weight:900;letter-spacing:.08em;cursor:pointer;box-shadow:0 6px 30px rgba(0,0,0,.45)}
.lf2-band{border-radius:5px;padding:2px 7px;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.lf2-band.b-strong{background:rgba(74,222,128,.12);border:1px solid #4ADE8055;color:#4ADE80}
.lf2-band.b-strongonwins{background:rgba(45,212,191,.12);border:1px solid #2DD4BF55;color:#2DD4BF}
.lf2-band.b-solid{background:rgba(91,164,230,.12);border:1px solid #5BA4E655;color:#5BA4E6}
.lf2-band.b-moderate{background:rgba(245,179,36,.12);border:1px solid #F5B32455;color:#F5B324}
.lf2-band.b-weak{background:rgba(230,57,70,.12);border:1px solid #E6394655;color:#ff8c93}
.lf2-sc{margin-top:10px;border:1px solid #2a3a7a;border-radius:8px;background:#0c1640;padding:8px 10px 9px}
.lf2-sc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:4px 6px;flex-wrap:wrap}
.lf2-sc-t{font-size:8.5px;font-weight:700;letter-spacing:.2em;color:#8fa3d9;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.lf2-sc-hear{font-size:10px;font-weight:700;letter-spacing:.04em;color:#38bdf8;text-decoration:none;border:1px solid #38bdf866;border-radius:4px;padding:1px 5px}
.lf2-sc-out{font-size:8px;font-weight:800;letter-spacing:.12em;padding:2px 8px;border-radius:4px;border:1px solid;white-space:nowrap}
.lf2-sc-bands{display:flex;gap:4px;flex-wrap:wrap}
.lf2-sc-tip{margin-top:7px;font-size:9.5px;line-height:1.45;color:#cfd9f5;background:#0a1233;border:1px solid #22307a;border-left:3px solid #f5c518;border-radius:6px;padding:6px 9px}
.lf2-ticker{display:flex;gap:8px;overflow-x:auto;padding:6px 2px;margin:2px 0 6px;-ms-overflow-style:none;scrollbar-width:none}
.lf2-ticker::-webkit-scrollbar{display:none}
.lf2-tick-chip{display:flex;align-items:center;gap:6px;background:#0f1738;border:1px solid #2b3c66;border-radius:20px;padding:5px 12px;white-space:nowrap;flex-shrink:0;font-size:10px}
.lf2-tick-time{color:#8fa3d9;font-weight:700}
.lf2-tick-tech{color:#f5c518;font-weight:800}
.lf2-tick-cust{color:#c7d4f0}
.lf2-tick-signed{background:linear-gradient(90deg,#F5B324,#ffe08a);color:#3a2c05;border-radius:4px;padding:1px 6px;font-weight:800;font-size:8.5px}
.lf2-stjob{font-size:8px;font-weight:700;letter-spacing:.05em;color:#5BA4E6;border:1px solid #5BA4E666;border-radius:4px;padding:1px 6px;text-decoration:none;white-space:nowrap}
.lf2-reccarry{background:rgba(245,179,36,.12);border:1px solid #F5B32488;color:#F5B324;border-radius:6px;padding:2px 8px;font-weight:800;font-size:10px;letter-spacing:.06em}

// ═══ ⚡ LIVE FEED · Service dept real-time job board (borrows lf2- visual language from index.html) ══════
// PT "now" in minutes-since-midnight, and a parser for "5:30p"-style stage time strings
// into minutes-since-midnight (also PT). Both share the same clock so elapsed-time math
// stays self-consistent even if the viewer's own machine is in a different timezone.
const ptNowMinutes=()=>{
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(new Date());
  const h=Number(parts.find(p=>p.type==="hour").value)%24;
  const m=Number(parts.find(p=>p.type==="minute").value);
  return h*60+m;
};
const parseStageTimeMinutes=str=>{
  if(typeof str!=="string") return null;
  const m=str.trim().match(/^(\d{1,2}):(\d{2})\s*([ap])m?$/i);
  if(!m) return null;
  let h=parseInt(m[1],10), mins=parseInt(m[2],10);
  const ap=m[3].toLowerCase();
  if(h<1||h>12||mins<0||mins>59) return null;
  if(ap==="p" && h!==12) h+=12;
  if(ap==="a" && h===12) h=0;
  return h*60+mins;
};
// acknowledged-violation store: once ACKNOWLEDGE is pressed, those violations
// never alarm again today (survives kiosk reloads via localStorage)
const LF2_ACK_KEY="lf2AckKeys";
const lf2TodayStr=()=>new Date().toLocaleDateString("en-US",{timeZone:"America/Los_Angeles"});
const lf2LoadAck=()=>{ try{ const o=JSON.parse(localStorage.getItem(LF2_ACK_KEY)||"null"); if(o&&o.d===lf2TodayStr()) return new Set(o.k); }catch(e){} return new Set(); };
const lf2SaveAck=(set)=>{ try{ localStorage.setItem(LF2_ACK_KEY,JSON.stringify({d:lf2TodayStr(),k:[...set]})); }catch(e){} };
// evaluate John's red-alert rules for one job card; returns {alerts:[{code,label}], isAlert}
const evalJobAlerts=(j,nowMin)=>{
  const st=j.stages||{};
  const alerts=[];
  // Part-install runs are parts drop-offs, not sales opportunities — no job-standards alerts (John 7/31)
  const jt=(j.jobType||"").toLowerCase();
  if(jt.includes("part") && jt.includes("install")){
    return {alerts,isAlert:false,isSigned:!!(st.signed&&typeof st.signed==="object")};
  }
  // SILO techs run TGL source calls in the service BUs — they appear on the board
  // but play by TGL rules, not service job standards. No 2A/2B team = no alerts (John 8/3)
  if(!((j.team||"").trim())){
    return {alerts,isAlert:false,isSigned:!!(st.signed&&typeof st.signed==="object")};
  }
  const onsiteRaw=st.onsite;
  const onsiteStr=typeof onsiteRaw==="string"?onsiteRaw:(onsiteRaw&&typeof onsiteRaw==="object"?onsiteRaw.t:null);
  const onsiteMin=parseStageTimeMinutes(onsiteStr);
  const doneNode=st.done, signedNode=st.signed;
  const isDone=doneNode!=null;
  const isSigned=!!(signedNode&&typeof signedNode==="object");
  let elapsedMin=null;
  if(onsiteMin!=null && nowMin!=null){
    let e=nowMin-onsiteMin;
    if(e>=0) elapsedMin=e; // negative => unparseable/skew guard: no elapsed-based alerts
  }
  // 1. LONG RUN — on site, not done/signed, elapsed > 2h (John 7/30)
  if(elapsedMin!=null && !isDone && !isSigned && elapsedMin>120){
    const hrs=(elapsedMin/60).toFixed(1);
    alerts.push({code:"long",label:"⏱ "+hrs+"H ON SITE"});
  }
  // 2. LOW OPTIONS — <4 options AND (onsite>=60m OR signed/done) — 1h grace (John 7/31)
  const optsNode=st.options;
  const optsCount=(optsNode&&typeof optsNode==="object")?(optsNode.n||0):0;
  const eligibleForOpts = (elapsedMin!=null && elapsedMin>=60) || isSigned || isDone;
  if(eligibleForOpts && optsCount<4){
    alerts.push({code:"opts",label:"OPTS "+optsCount+"/4"});
  }
  // 3. LOW PHOTOS — <30 AND (done OR onsite>=90m)
  const photos=j.photos!=null?j.photos:0;
  const eligibleForPhotos = isDone || (elapsedMin!=null && elapsedMin>=90);
  if(eligibleForPhotos && photos<30){
    alerts.push({code:"photos",label:"📷 "+photos+"/30"});
  }
  // 4. ZERO TICKET — done AND signed total is 0/absent
  if(isDone){
    const signedTotal=isSigned?(signedNode.total||0):0;
    if(!signedTotal){
      alerts.push({code:"zero",label:"$0 TICKET"});
    }
  }
  // 5. NOT RECORDING — Siro data available, no recording for this visit, job well underway
  // (never fires on a tech who is actively recording right now)
  if(j.siro && !j.siro.rec && !j.siro.recNow && !j.siro.liveTech && (isDone || (elapsedMin!=null && elapsedMin>=45))){
    alerts.push({code:"norec",label:"🎙 NOT RECORDING"});
  }
  // 6. MEMBER NOT CONVERTED — membership opportunity surfaced but job closed without the sale
  if(isDone && j.membershipOffered && !j.membershipSold){
    alerts.push({code:"member",label:"🪪 MEMBER NOT CONVERTED"});
  }
  return {alerts,isAlert:alerts.length>0,isSigned};
};

        .then(r=>{ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
        .then(j=>{ setHealth(j); setErr(false); })
        .catch(()=>{ setErr(true); });
    };
    load(); const id=setInterval(load,120000); const t=setInterval(()=>setNow(Date.now()),60000);
    return ()=>{clearInterval(id);clearInterval(t);};
  },[]);

  const humanAge=min=>{ if(min==null||isNaN(min)) return "—"; if(min<1) return "just now"; if(min<60) return Math.round(min)+"m"; if(min<1440) return Math.round(min/60)+"h"; return "yesterday"; };
  const genMs = health&&health.generatedMs ? health.generatedMs : (health&&health.generated?Date.parse(health.generated):null);
  const healthAgeMin = genMs ? (now-genMs)/60000 : null;
  const unknown = !health || err || healthAgeMin==null || healthAgeMin>45;
  const worst = health ? health.worst : null;
  const counts = (health && health.counts) || {};
  const checks = Array.isArray(health&&health.checks) ? health.checks.slice() : [];
  const RANK={dead:0,warn:1,ok:2};
  checks.sort((a,b)=>(RANK[a.status]!=null?RANK[a.status]:3)-(RANK[b.status]!=null?RANK[b.status]:3));

  let pillBg,pillColor,pillBorder,pillText;
  if(unknown){ pillBg="rgba(107,122,153,.12)"; pillColor="#9fb3cc"; pillBorder="#6b7a9955"; pillText="HEALTH UNKNOWN"; }
  else if(worst==="dead"){ pillBg="rgba(230,57,70,.12)"; pillColor="#ff7b86"; pillBorder="#e6394655"; pillText="🛑 "+(counts.dead||0)+" PIPELINE"+((counts.dead||0)===1?"":"S")+" DOWN"; }
  else if(worst==="warn"){ pillBg="rgba(245,179,36,.12)"; pillColor="#F5B324"; pillBorder="#F5B32455"; pillText="⚠ "+(counts.warn||0)+" DEGRADED"; }
  else { pillBg="rgba(74,222,128,.12)"; pillColor="#4ADE80"; pillBorder="#4ADE8055"; pillText="✓ SYSTEMS OK"; }

  const dotColor=s=>s==="dead"?"#ff7b86":s==="warn"?"#F5B324":"#4ADE80";

  return (
    <div style={{position:"relative",display:"inline-block"}}>
      <button onClick={()=>setOpen(o=>!o)} title="System health — click to expand" style={{background:pillBg,border:"1px solid "+pillBorder,color:pillColor,borderRadius:8,padding:"6px 12px",cursor:"pointer",fontFamily:"inherit",fontSize:10.5,fontWeight:800,letterSpacing:"0.06em",display:"flex",alignItems:"center",gap:6}}>
        {pillText}{checks.length?<span style={{fontSize:9,opacity:.7}}>{open?"▲":"▼"}</span>:null}
      </button>
      {open && (
        <div style={{position:"absolute",right:0,top:"calc(100% + 6px)",zIndex:2000,background:"#0e1626",border:"1px solid #1e2d47",borderRadius:12,padding:"12px 14px",minWidth:300,maxWidth:420,maxHeight:400,overflowY:"auto",boxShadow:"0 10px 30px rgba(0,0,0,.5)"}}>
          <div style={{fontSize:10,fontWeight:800,color:"#9fb3cc",letterSpacing:".08em",marginBottom:8}}>SYSTEM HEALTH</div>
          {checks.length ? checks.map((c,i)=>(
            <div key={c.key||i} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"6px 0",borderTop:i?"1px solid #1e2d47":"none"}}>
              <span style={{width:8,height:8,borderRadius:"50%",background:dotColor(c.status),marginTop:4,flexShrink:0}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
                  <span style={{fontSize:11,fontWeight:700,color:"#e6eefb"}}>{c.label||c.key||"—"}</span>
                  <span style={{fontSize:9.5,color:"#6b7a99",flexShrink:0}}>{humanAge(c.ageMin)}</span>
                </div>
                {c.note && <div style={{fontSize:9.5,color:"#6b7a99",marginTop:2}}>{c.note}</div>}
              </div>
            </div>
          )) : <div style={{fontSize:10.5,color:"#6b7a99"}}>{unknown?"health.json unavailable or stale — the watcher itself may be down.":"No checks reported."}</div>}
          {health && health.generated && <div style={{fontSize:9,color:"#4a5a70",marginTop:8,paddingTop:8,borderTop:"1px solid #1e2d47"}}>health.json generated {humanAge(healthAgeMin)} ago</div>}
        </div>
      )}
    </div>
  );
}

function ServiceLiveTab(){
  const [lf,setLf]=React.useState(null);
  const [err,setErr]=React.useState(false);
  const [teamFilter,setTeamFilter]=React.useState("ALL");
  const [now,setNow]=React.useState(Date.now());
  const seenSignedRef=React.useRef(null); // null until first data arrival (seed, no flash)
  const [flashIds,setFlashIds]=React.useState({}); // jobId -> true while gold flash animation plays
  const seenAlertKeysRef=React.useRef(null); // null until first data; first load alarms on existing violations
  const ackRef=React.useRef(null);
  if(ackRef.current==null) ackRef.current=lf2LoadAck();
  const [alarmItems,setAlarmItems]=React.useState([]); // active takeover violations; only EXIT clears
  const sirenTimerRef=React.useRef(null);
  const sirenNodesRef=React.useRef([]);
  const [soundOn,setSoundOn]=React.useState(true);
  const soundOnRef=React.useRef(true);
  const audioCtxRef=React.useRef(null);
  const playSirenOnce=()=>{
    if(!soundOnRef.current) return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      if(!audioCtxRef.current) audioCtxRef.current=new AC();
      const ctx=audioCtxRef.current;
      if(ctx.state==="suspended"){ ctx.resume().catch(()=>{}); }
      // tornado-siren wail: slow rise/fall sweep, loud, 3 cycles (~4s)
      const t0=ctx.currentTime, dur=1.3, cycles=3;
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sawtooth";
      for(let i=0;i<cycles;i++){
        const s=t0+i*dur;
        o.frequency.setValueAtTime(400,s);
        o.frequency.linearRampToValueAtTime(820,s+dur*0.55);
        o.frequency.linearRampToValueAtTime(400,s+dur);
      }
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.6,t0+0.08);
      g.gain.setValueAtTime(0.6,t0+cycles*dur-0.15);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+cycles*dur);
      o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0+cycles*dur+0.05);
      sirenNodesRef.current.push(o);
      o.onended=()=>{ sirenNodesRef.current=sirenNodesRef.current.filter(x=>x!==o); };
    }catch(e){}
  };
  const startAlarmLoop=()=>{
    if(sirenTimerRef.current) return;
    playSirenOnce();
    sirenTimerRef.current=setInterval(playSirenOnce,4100);
  };
  const stopAlarmLoop=()=>{
    if(sirenTimerRef.current){ clearInterval(sirenTimerRef.current); sirenTimerRef.current=null; }
    sirenNodesRef.current.forEach(o=>{ try{o.stop();}catch(e){} });
    sirenNodesRef.current=[];
  };

  const load=()=>{
    fetch("https://raw.githubusercontent.com/johnschwinghamer94-lab/sierra-ropp-dashboard/main/servicefeed.json?_="+Date.now())
      .then(r=>{ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
      .then(d=>{
        const jobsArr=d.jobs||[];
        // alarm + full-screen flash on every new violation (John: make it known)
        const nmA=ptNowMinutes();
        const nowAlertKeys=new Set();
        jobsArr.forEach(j=>{ evalJobAlerts(j,nmA).alerts.forEach(a=>nowAlertKeys.add(j.jobId+":"+a.code)); });
        const prevKeys=seenAlertKeysRef.current;
        const ack=ackRef.current;
        const newKeys=[...nowAlertKeys].filter(k=>!(prevKeys&&prevKeys.has(k)) && !ack.has(k));
        seenAlertKeysRef.current=nowAlertKeys;
        if(newKeys.length){
          const byJob={};
          newKeys.forEach(k=>{ const i=k.indexOf(":"); const id=k.slice(0,i); byJob[id]=true; });
          const items=Object.keys(byJob).map(id=>{
            const j=jobsArr.find(x=>String(x.jobId)===String(id))||{};
            const ev=evalJobAlerts(j,nmA);
            return {key:String(id),tech:j.tech||"?",team:j.team||"",customer:j.customer||"",labels:ev.alerts.map(a=>a.label)};
          });
          setAlarmItems(prev=>{
            const have=new Set(prev.map(p=>p.key));
            return [...prev,...items.filter(it=>!have.has(it.key))];
          });
          startAlarmLoop();
        }
        const nowSignedIds=new Set(jobsArr.filter(j=>{
          const sn=(j.stages||{}).signed;
          return !!(sn&&typeof sn==="object");
        }).map(j=>j.jobId));
        if(seenSignedRef.current==null){
          seenSignedRef.current=nowSignedIds; // first load: seed only, never flash
        } else {
          const newlySigned=[...nowSignedIds].filter(id=>!seenSignedRef.current.has(id));
          if(newlySigned.length){
            setFlashIds(prev=>{
              const next={...prev};
              newlySigned.forEach(id=>{ next[id]=true; });
              return next;
            });
            newlySigned.forEach(id=>{
              setTimeout(()=>{ setFlashIds(prev=>{ const n={...prev}; delete n[id]; return n; }); },3000);
            });
          }
          seenSignedRef.current=nowSignedIds;
        }
        setLf(d); setErr(false);
      })
      .catch(()=>setErr(true));
  };
  React.useEffect(()=>{ load(); const id=setInterval(load,20000); const t=setInterval(()=>setNow(Date.now()),15000); return ()=>{clearInterval(id);clearInterval(t);}; },[]);
  const [coach,setCoach]=React.useState(null);
  React.useEffect(()=>{
    const loadCoach=()=>{
      fetch("https://raw.githubusercontent.com/johnschwinghamer94-lab/sierra-ropp-dashboard/main/servicecards.json?_="+Date.now())
        .then(r=>r.ok?r.json():null)
        .then(d=>{ setCoach((d&&d.cards)?d.cards:[]); })
        .catch(()=>setCoach([]));
    };
    loadCoach(); const cid=setInterval(loadCoach,60000); return ()=>clearInterval(cid);
  },[]);

  if(!lf){
    return (<div className="lf2-wrap riseIn" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"50vh"}}>
      <div style={{color:"#8fa3d9",fontSize:12,letterSpacing:"0.1em"}}>{err?"⚠ COULD NOT LOAD servicefeed.json":"◆ LOADING LIVE FEED…"}</div>
    </div>);
  }

  const K=lf.kpis||{};
  const jobs=lf.jobs||[];
  const activity=lf.activity||[];
  const teamsList=["ALL","2A","2B"];
  const fmt$=v=>"$"+Math.round(v||0).toLocaleString();

  // staleness check
  const updatedMs = lf.generatedMs || (lf.updated?Date.parse(lf.updated):null) || (lf.generated?Date.parse(lf.generated):null);
  const ageMin = updatedMs ? Math.round((now-updatedMs)/60000) : null;
  const stale = ageMin!=null && ageMin>10;

  // stage node values come in 3 shapes: null (not reached), "✓" (reached, no time), a
  // plain time string ("9:59a", e.g. "done"), or an object ({t, n?, total?} for
  // options/signed/leadSet). txt() safely reduces any of these to a renderable string.
  const txt=v=>{
    if(v==null) return null;
    if(typeof v==="object") return v.t!=null?v.t:null;
    return v;
  };
  const STAGE_DEFS=[
    ["dispatched","DISP","🚚"],
    ["onsite","SITE","📍"],
    ["options","OPT","📋"],
    ["signed","SIGN","✍️"],
    ["done","DONE","✅"],
  ];
  const isActive=j=>j.status!=="Done";
  const latestStageMs=j=>{
    const st=j.stages||{}; let best=0;
    STAGE_DEFS.forEach(([k])=>{ const tv=txt(st[k]); if(tv && tv!=="✓"){ const p=Date.parse((lf.date||"")+" "+tv); if(!isNaN(p) && p>best) best=p; } });
    return best;
  };
  const filtered=jobs.filter(j=>teamFilter==="ALL"||j.team===teamFilter);
  const sorted=[...filtered].sort((a,b)=>{
    const aA=isActive(a)?1:0, bA=isActive(b)?1:0;
    if(aA!==bA) return bA-aA;
    return latestStageMs(b)-latestStageMs(a);
  });

  const buCol=bu=>{
    if(!bu) return "#8fa3d9";
    const s=bu.toLowerCase();
    if(s.includes("maint")) return "#4ade80";
    if(s.includes("repair")) return "#f5c518";
    if(s.includes("install")) return "#5BA4E6";
    return "#8fa3d9";
  };
  const buShort=bu=>{
    if(!bu) return "SVC";
    const parts=bu.split(" - ");
    return (parts[1]||parts[0]||bu).slice(0,14);
  };

  const timeline=j=>{
    const st=j.stages||{};
    return (<div className="lf2-tl">
      {STAGE_DEFS.map(([k,lab,icon],i)=>{
        const v=st[k];
        const lit=v!=null;
        const sub=txt(v);
        return (<React.Fragment key={k}>
          <div className="lf2-node">
            <div className={"lf2-ring"+(lit?(k==="done"?" green":" lit"):"")}>{icon}</div>
            <div className="lf2-nlab">{lab}</div>
            <div className="lf2-nsub" style={k==="done"&&lit?{color:"#4ade80"}:null}>{lit?(sub||"✓"):"–"}</div>
          </div>
          {i<STAGE_DEFS.length-1 && <div className={"lf2-seg"+(lit?" lit":"")}/>}
        </React.Fragment>);
      })}
    </div>);
  };

  const nowMin=ptNowMinutes();
  const redAlertCount=jobs.filter(j=>evalJobAlerts(j,nowMin).isAlert).length;

  // ── per-card call coaching (Siro servicecards.json — word bands only) ──────
  const nrmTech=t=>(t||"").toLowerCase().replace(/\s+/g," ").trim();
  const findCoach=j=>{
    if(!coach||!coach.length) return null;
    const jn=String(j.jobNumber||"");
    let c=jn?coach.find(x=>x.jobNumber&&String(x.jobNumber)===jn):null;
    let isLastCall=false;
    if(!c){
      const jt=nrmTech(j.tech);
      if(jt){
        const matches=coach.filter(x=>nrmTech(x.tech)===jt);
        if(matches.length){
          c=matches.reduce((a,b)=>(new Date(b.dateCreated||0)>new Date(a.dateCreated||0)?b:a));
          isLastCall=true;
        }
      }
    }
    return c?{c,isLastCall}:null;
  };
  const minutesAgo=c=>{
    const ts=c.dateCreated||c.available;
    if(!ts) return null;
    const p=Date.parse(ts);
    if(isNaN(p)) return null;
    return Math.max(0,Math.round((now-p)/60000));
  };
  const coachSection=j=>{
    const found=findCoach(j);
    if(!found) return null;
    const {c,isLastCall}=found;
    const tip=c.tip||"";
    const isWin=/^WIN\b/i.test(tip);
    const isFix=/^FIX\b/i.test(tip);
    const body=tip.replace(/^(WIN|FIX)\s*[—:\-]\s*/i,"");
    const lab=isWin?"✋ WHAT WORKED":isFix?"🎯 NEXT TIME":null;

      <div className="lf2-sc" onClick={ev=>ev.stopPropagation()}>
        <div className="lf2-sc-h">

          ):null)}
        </div>}
        {body && <div className="lf2-sc-tip">
          {lab && <span style={{color:labCol,fontWeight:800,letterSpacing:".08em",marginRight:6}}>{lab} —</span>}

        </div>}
      </div>
    );
  };

  const jobCard=j=>{

    return (
      <div key={j.jobId} className={kls} onClick={()=>window.open("https://go.servicetitan.com/#/Job/Index/"+j.jobId,"_blank","noopener")}>
        <div className="lf2-cardtop">
          <div>
            <div className="lf2-tech">{j.tech||"Unassigned"}{j.team?<span style={{color:"#8fa3d9",fontWeight:700,fontSize:9}}> · {j.team}</span>:null}</div>
            <div className="lf2-cust">{j.customer}</div>
            <div className="lf2-stat">{j.status||""}{j.jobType?" · "+j.jobType:""}</div>
          </div>
          <span style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
            <span className="lf2-buchip" style={{color:buCol(j.bu),borderColor:buCol(j.bu)+"77"}}>{buShort(j.bu)}</span>
            <a href={"https://go.servicetitan.com/#/Job/Index/"+j.jobId} target="_blank" rel="noopener" onClick={ev=>ev.stopPropagation()} className="lf2-stjob">ST JOB ↗</a>
          </span>
        </div>
        {timeline(j)}
        <div className="lf2-cardbot">
          <span style={{color:"#8fa3d9"}}>{j.photos!=null?("📷 "+j.photos+"/30"+((j.status==="Done"&&j.photos<30)?" ⚠":"")):""}</span>
          <span style={{display:"flex",gap:6,alignItems:"center"}}>
            {optsCount>0 && <span style={{color:"#f5c518",fontWeight:700}}>{optsCount} opt · {fmt$(optsTotal)}</span>}
            {sold && <span style={{color:"#4ade80",fontWeight:800,border:"1px solid #4ade8088",background:"rgba(74,222,128,.12)",borderRadius:4,padding:"2px 7px"}}>{fmt$(soldTotal)}</span>}
            {sold && <span className="lf2-signedchip">✦ SIGNED</span>}
            {j.siro && j.siro.recNow && j.stages && j.stages.onsite && !j.stages.done && <span className="lf2-recnow">REC ●</span>}
            {j.siro && !j.siro.recNow && j.siro.liveTech && j.stages && j.stages.onsite && !j.stages.done && <span className="lf2-reccarry">🎙 REC · RUNNING</span>}
            {j.siro && j.siro.rec && !j.siro.recNow && <span className="lf2-recchip">🎙 REC</span>}
            {j.membershipSold && <span title="Membership sold">🎟</span>}
          </span>
        </div>
        {isAlert && <div className="lf2-alertrow">
          {alerts.map(a=><span key={a.code} className="lf2-alertchip">{a.label}</span>)}
        </div>}
        {j.stages && j.stages.done ? coachSection(j) : null}
      </div>
    );
  };

  // last 6 completed jobs, newest first — for the completions ticker
  const doneTimeMs=j=>{
    const dv=txt((j.stages||{}).done);
    if(!dv||dv==="✓") return 0;
    const p=Date.parse((lf.date||"")+" "+dv);
    return isNaN(p)?0:p;
  };
  const completed=jobs.filter(j=>!!(j.stages&&j.stages.done))
    .sort((a,b)=>doneTimeMs(b)-doneTimeMs(a))
    .slice(0,6);

  return (
    <div className="lf2-wrap riseIn">
      <div className="lf2-head">
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div className="lf2-logo">S</div>
          <div>
            <div className="lf2-title">Sierra Air — Service Live Feed</div>
            <div className="lf2-subtl">{lf.day||""} {lf.date?"· "+lf.date:""}</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          {alarmItems.length>0 && ReactDOM.createPortal(<div className="lf2-alarm-takeover">
            <div className="lf2-alarm-title">🚨 JOB STANDARDS VIOLATION 🚨</div>
            <div className="lf2-alarm-list">
              {alarmItems.map(it=>(<div className="lf2-alarm-item" key={it.key}>
                <div className="lf2-alarm-tech">{it.tech}{it.team?<span className="lf2-alarm-team"> · {it.team}</span>:null}</div>
                {it.customer?<div className="lf2-alarm-cust">{it.customer}</div>:null}
                <div className="lf2-alarm-labels">{it.labels.map((l,i)=>(<span key={i} className="lf2-alarm-label">{l}</span>))}</div>
              </div>))}
            </div>
            <button className="lf2-alarm-exit" onClick={()=>{ const ack=ackRef.current; if(seenAlertKeysRef.current){ seenAlertKeysRef.current.forEach(k=>ack.add(k)); } lf2SaveAck(ack); setAlarmItems([]); stopAlarmLoop(); }}>✕ ACKNOWLEDGE — STOP ALARM</button>
          </div>,document.getElementById("root"))}
          {lf && lf.siroToday && <div className="lf2-recchip" style={{padding:"5px 12px"}}>🎙 {lf.siroToday.recorded}/{lf.siroToday.of} RECORDING TODAY</div>}
          {redAlertCount>0 && <div className="lf2-headalert">🔴 {redAlertCount} ALERT{redAlertCount===1?"":"S"}</div>}
          {stale
