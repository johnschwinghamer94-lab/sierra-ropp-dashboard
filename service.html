<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sierra Service Command</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="engine.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#070b16;color:#eaf1fb;font-family:'Inter','Segoe UI',system-ui,sans-serif;min-height:100vh;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:#070b16;}
::-webkit-scrollbar-thumb{background:#1e2d47;border-radius:3px;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 8px currentColor;}50%{opacity:.4;box-shadow:0 0 2px currentColor;}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes drawArc{from{stroke-dashoffset:440;}to{stroke-dashoffset:0;}}
@keyframes growUp{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 3px currentColor);}50%{filter:drop-shadow(0 0 13px currentColor);}}
@keyframes growW{from{width:0;}}
/* ═══ TEST ENHANCEMENTS ═══════════════════════════════════════════════════ */
/* Sticky header */
.sticky-hdr{position:sticky;top:0;z-index:100;backdrop-filter:blur(14px);}
/* Animated number counter */
@keyframes numPop{0%{transform:translateY(6px);opacity:.3}100%{transform:translateY(0);opacity:1}}
.num-pop{display:inline-block;animation:numPop .35s cubic-bezier(.2,.7,.2,1) both;}
/* Last-updated badge */
.upd-badge{font-size:9px;color:#4ADE80;font-weight:700;letter-spacing:.1em;background:rgba(74,222,128,.10);
  padding:3px 9px;border-radius:20px;border:1px solid rgba(74,222,128,.3);animation:pulse 3s ease infinite;}
/* Tab count badge */
.tcnt{background:rgba(245,179,36,.18);color:#F5B324;border-radius:9px;padding:1px 5px;
  font-size:8px;font-weight:700;margin-left:3px;vertical-align:middle;}
/* Keyboard hint */
.kbd{background:#1e2d47;border:1px solid #2E78C7;color:#7089ab;border-radius:4px;
  padding:1px 5px;font-size:8px;font-family:monospace;display:inline-block;}
/* Tooltip host */
.tiphost{position:relative;cursor:help;}
.tiphost:hover .tipbubble{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
.tipbubble{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%) translateY(5px);
  background:#1a2740;border:1px solid #2E78C7;color:#eaf1fb;font-size:10px;line-height:1.5;
  padding:7px 11px;border-radius:9px;white-space:nowrap;z-index:300;opacity:0;
  transition:opacity .18s,transform .18s;pointer-events:none;max-width:220px;text-align:center;}
/* Projected month-end pill */
.proj-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
  padding:4px 10px;border-radius:20px;border:1px solid;letter-spacing:.04em;}
/* Tab content fade-in */
@keyframes tabFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.tab-fade{animation:tabFade .28s cubic-bezier(.2,.7,.2,1) both;}
/* Table row hover */
.trow{transition:background .12s ease;}
.trow:hover{background:rgba(46,120,199,.10)!important;}
/* Current hour highlight */
.cur-hour{background:rgba(245,179,36,.12)!important;border-left:3px solid #F5B324!important;}
/* KPI alert */
@keyframes alertPulse{0%,100%{opacity:1}50%{opacity:.65}}
.kpi-alert{animation:alertPulse 1.8s ease infinite;background:rgba(230,57,70,.15);border-bottom:1px solid #E63946aa;
  padding:7px 20px;font-size:10px;font-weight:700;color:#E63946;letter-spacing:.08em;display:flex;align-items:center;gap:10px;}
/* Perf badge */
.fire-badge{font-size:10px;margin-left:4px;}
/* Scroll-to-top btn */
#scr-top{position:fixed;bottom:28px;right:24px;z-index:500;background:#F5B324;color:#070b16;border:none;
  border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;display:none;align-items:center;
  justify-content:center;box-shadow:0 4px 18px rgba(245,179,36,.5);transition:transform .15s ease;}
#scr-top:hover{transform:scale(1.12);}
/* Projected MTD pill */
/* Countdown timer */
.countdown{font-size:9px;color:#2E78C7;font-weight:700;letter-spacing:.08em;
  background:rgba(46,120,199,.12);border:1px solid rgba(46,120,199,.3);
  padding:3px 9px;border-radius:20px;font-family:monospace;}
/* Kiosk mode */
.kiosk-btn{background:rgba(245,179,36,.1);border:1px solid #F5B32455;color:#F5B324;
  border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:10px;
  font-weight:700;letter-spacing:.06em;transition:all .15s;}
.kiosk-btn.active{background:#F5B324;color:#070b16;}
/* Refresh button */
.refresh-btn{background:rgba(46,120,199,.15);border:1px solid #2E78C755;color:#2E78C7;
  border-radius:8px;padding:6px 11px;cursor:pointer;font-family:inherit;font-size:12px;
  transition:all .15s;}
.refresh-btn:hover{background:#2E78C7;color:#fff;}
.refresh-btn.spinning{animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
/* KPI slider */
.kpi-slider-wrap{display:flex;align-items:center;gap:7px;font-size:9px;color:#7089ab;}
input[type=range].kpi-range{-webkit-appearance:none;width:80px;height:4px;
  background:linear-gradient(90deg,#E63946,#F5B324,#2E78C7);border-radius:2px;outline:none;cursor:pointer;}
input[type=range].kpi-range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:#F5B324;border:2px solid #070b16;cursor:pointer;}
/* Celebration */
@keyframes celebPop{0%{transform:scale(1)}30%{transform:scale(1.12)}60%{transform:scale(.97)}100%{transform:scale(1)}}
.celebrate{animation:celebPop .5s ease;}
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;}
/* Days left chip */
.days-left{font-size:9px;color:#7089ab;font-weight:600;background:rgba(255,255,255,.05);
  border:1px solid #1e2d47;padding:2px 8px;border-radius:12px;}
/* Gradient leaderboard bars */
.lb-bar{height:16px;border-radius:5px;animation:growW 1s ease both;transform-origin:left;}
/* CSV export btn */
.csv-btn{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:#4ADE80;
  border-radius:7px;padding:6px 13px;cursor:pointer;font-family:inherit;font-size:10px;
  font-weight:700;letter-spacing:.05em;transition:all .15s;}
.csv-btn:hover{background:#4ADE80;color:#070b16;}
/* TODAY sparkline overlay */
.today-spark{position:absolute;bottom:4px;left:8px;right:8px;opacity:.5;}
.proj-mtd{background:linear-gradient(135deg,rgba(46,120,199,.18),rgba(245,179,36,.08));border:1px solid #2E78C744;
  border-radius:12px;padding:10px 16px;min-width:160px;}
/* Tech filter input */
.tech-filter{background:#0e1626;border:1px solid #1e2d47;color:#eaf1fb;border-radius:8px;padding:7px 13px;
  font-family:inherit;font-size:11px;outline:none;width:220px;transition:border-color .15s;}
.tech-filter:focus{border-color:#2E78C7;}
/* Mobile responsive tweaks */
@media(max-width:640px){
  h1{font-size:16px!important;}
  .gauge-grid{grid-template-columns:1fr 1fr!important;}
  .ticker-bar{font-size:10px!important;}
  button[data-tab]{padding:6px 8px!important;font-size:9px!important;}
  /* KPI cards go 2-up and shrink to fit narrow screens */
  .kpi-card{min-width:0!important;flex:1 1 42%!important;padding:10px 8px!important;}
  .kpi-card>div:nth-child(2){font-size:19px!important;}
  /* Compact tables + let wide tables scroll horizontally inside their card */
  table{font-size:10px!important;}
  th,td{padding:6px 5px!important;}
  /* Full-width filter / search inputs */
  .tech-filter,.tab-search{width:100%!important;}
  /* Trim heavy section padding so content isn't squeezed */
  .sec-pad{padding-left:12px!important;padding-right:12px!important;}
}

/* ── Round 4 Global ─────────────────────────────────────────── */
tr.hov-row{transition:background .12s;}
tr.hov-row:hover td{background:#1a2540 !important;}
.hm-cell{position:relative;transition:background .2s;}
.medal-1{color:#FFD700;text-shadow:0 0 8px #FFD70088;font-size:14px;}
.medal-2{color:#C0C0C0;font-size:14px;}
.medal-3{color:#CD7F32;font-size:14px;}
@keyframes champGlow{0%,100%{box-shadow:0 0 0 transparent}50%{box-shadow:0 0 22px #F5B32466}}
.champion-row{animation:champGlow 2.5s ease-in-out infinite;}
.fire-badge{font-size:13px;animation:fireFlicker .7s alternate infinite;}
@keyframes fireFlicker{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.15) rotate(3deg)}}
.trend-up{color:#4ADE80;font-weight:800;font-size:11px;}
.trend-dn{color:#E63946;font-weight:800;font-size:11px;}
.trend-eq{color:#6b7a99;font-size:11px;}
.tab-search{background:#0a1220;border:1px solid #1e2d47;color:#fff;border-radius:8px;
  padding:6px 12px;font-family:inherit;font-size:11px;outline:none;transition:border .15s;width:180px;}
.tab-search:focus{border-color:#F5B324;}
.tab-search::placeholder{color:#4a5a70;}
.pace-ring{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);}
.scenario-bar{height:12px;border-radius:4px;animation:growW 1s ease both;}
.hm-great{background:rgba(46,120,199,.18) !important;}
.hm-good{background:rgba(245,179,36,.14) !important;}
.hm-bad{background:rgba(230,57,70,.14) !important;}
.spark-svg{overflow:visible;}
.eod-tile{background:linear-gradient(135deg,#0f1e38,#162849);border:1px solid #2E78C744;
  border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:4px;}
.beat-chip{background:rgba(74,222,128,.15);border:1px solid rgba(74,222,128,.3);
  color:#4ADE80;font-size:9px;font-weight:800;padding:2px 7px;border-radius:10px;}
.miss-chip{background:rgba(230,57,70,.15);border:1px solid rgba(230,57,70,.3);
  color:#E63946;font-size:9px;font-weight:800;padding:2px 7px;border-radius:10px;}
/* ─────────────────────────────────────────────────────────────── */
.riseIn{animation:riseIn .55s cubic-bezier(.2,.7,.2,1) both;}
.liftCard{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
.liftCard:hover{transform:translateY(-3px);box-shadow:0 10px 34px rgba(0,0,0,.45);border-color:#2E78C7 !important;}
.gridbg{background-image:linear-gradient(rgba(46,120,199,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(46,120,199,.05) 1px,transparent 1px);background-size:34px 34px;}
/* ═══ LIVE FEED TAB (borrowed lf2- visual language from index.html) ══════ */
.lf2-wrap{font-family:'Chakra Petch','Inter',sans-serif;min-height:70vh;background:radial-gradient(ellipse 80% 50% at 50% -10%,#122052 0%,#0a1024 55%,#070b1a 100%);padding:0 0 44px}
.lf2-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 22px;background:linear-gradient(90deg,#0b1230ee,#101b45ee);border-bottom:1px solid #22307a}
.lf2-logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#f5c518,#c79a0a);display:flex;align-items:center;justify-content:center;font-weight:900;color:#081020;font-size:20px;box-shadow:0 0 14px #f5c51833}
.lf2-title{font-size:15px;font-weight:700;letter-spacing:.14em;color:#fff;text-transform:uppercase}
.lf2-subtl{font-size:9px;letter-spacing:.3em;color:#f5c518;margin-top:2px;font-weight:600;text-transform:uppercase}
.lf2-chip-live{display:flex;align-items:center;gap:7px;background:#0d2b18;border:1px solid #35d07f66;border-radius:6px;padding:5px 13px;color:#4ade80;font-weight:700;font-size:10px;letter-spacing:.2em}
.lf2-chip-night{background:#101b30;border:1px solid #2E78C755;border-radius:6px;padding:5px 13px;color:#7fb3e8;font-weight:700;font-size:10px;letter-spacing:.14em}
.lf2-chip-stale{background:#2a0d12;border:1px solid #e63946;border-radius:6px;padding:5px 13px;color:#ff7b86;font-weight:700;font-size:10px;letter-spacing:.14em;animation:lf2Blink 1.2s infinite}
.lf2-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:lf2Pulse 1.6s infinite}
@keyframes lf2Pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
@keyframes lf2Blink{50%{opacity:.45}}
.lf2-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:16px 22px 4px}
.lf2-kpi{background:linear-gradient(180deg,#0d1638,#0a1130);border:1px solid #22307a;border-radius:10px;padding:12px 18px;box-shadow:inset 0 0 26px #101d5240}
.lf2-kpi .l{font-size:9px;letter-spacing:.24em;color:#8fa3d9;font-weight:600;text-transform:uppercase}
.lf2-kpi .v{font-size:27px;font-weight:700;color:#fff;margin-top:3px}
.lf2-kpi .s{font-size:9.5px;color:#5d6fa8;margin-top:2px;letter-spacing:.08em}
.lf2-bus{display:flex;gap:8px;padding:12px 22px 0;flex-wrap:wrap}
.lf2-bu{font-size:9.5px;font-weight:700;letter-spacing:.16em;padding:4px 14px;border-radius:5px;border:1px solid #22307a;color:#8fa3d9;cursor:pointer;background:#0a1130;text-transform:uppercase}
.lf2-bu.on{border-color:#f5c518;color:#f5c518;background:#f5c51811;box-shadow:0 0 10px #f5c51822}
.lf2-main{display:flex;gap:14px;padding:14px 22px;align-items:flex-start;flex-wrap:wrap}
.lf2-grid{flex:2.6 1 560px;min-width:300px;display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:12px}
.lf2-card{background:linear-gradient(180deg,#0e1a45,#0a1233);border:1px solid #243380;border-radius:10px;padding:11px 13px 10px;box-shadow:0 0 16px #060b2088;cursor:pointer;transition:transform .12s,border-color .12s;position:relative;overflow:hidden}
.lf2-card::after{content:"";position:absolute;top:0;left:-85%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-18deg);transition:left .55s ease;pointer-events:none;}
.lf2-card:hover::after{left:125%;}
.lf2-card:hover{transform:translateY(-2px);border-color:#f5c518aa}
.lf2-card.working{border-color:#f5c51866;box-shadow:0 0 18px #f5c51815}
.lf2-card.done{opacity:.78}
@keyframes lf2CardAlertPulse{0%,100%{border-color:#E63946;box-shadow:0 0 10px #E3394666}50%{border-color:#ff8c93;box-shadow:0 0 20px #E63946aa}}
.lf2-card.alert{border-color:#E63946!important;animation:lf2CardAlertPulse 2s ease-in-out infinite}
.lf2-alertrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.lf2-alertchip{font-size:8.5px;font-weight:800;letter-spacing:.06em;color:#ff8c93;background:rgba(230,57,70,.14);border:1px solid #E6394677;border-radius:4px;padding:2px 7px;white-space:nowrap}
@keyframes lf2GoldFlash{0%{border-color:#F5B324;box-shadow:0 0 6px #F5B32455}25%{border-color:#ffe08a;box-shadow:0 0 34px #F5B324dd,0 0 60px #F5B32488}100%{border-color:#F5B32499;box-shadow:0 0 10px #F5B32444}}
.lf2-card.goldFlash{animation:lf2GoldFlash 3s ease-out 1 both}
.lf2-card.goldSettled{border-color:#F5B32499!important;box-shadow:0 0 10px #F5B32444}
.lf2-signedchip{font-size:8.5px;font-weight:800;letter-spacing:.06em;color:#3a2c05;background:linear-gradient(90deg,#F5B324,#ffe08a);border-radius:4px;padding:2px 7px;white-space:nowrap;margin-left:6px}
.lf2-headalert{background:rgba(230,57,70,.14);border:1px solid #E6394677;color:#ff8c93;border-radius:6px;padding:5px 12px;font-weight:800;font-size:10px;letter-spacing:.08em;animation:lf2Blink 1.2s infinite}
.lf2-cardtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lf2-tech{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:#f5c518;text-transform:uppercase;line-height:1.25}
.lf2-cust{font-size:10px;font-weight:600;color:#e7ecfa;text-transform:uppercase;margin-top:2px;letter-spacing:.04em}
.lf2-stat{font-size:9px;color:#8fa3d9;margin-top:3px;letter-spacing:.06em}
.lf2-buchip{font-size:8px;font-weight:700;letter-spacing:.14em;border-radius:4px;padding:2px 8px;border:1px solid;white-space:nowrap;text-transform:uppercase}
.lf2-tl{display:flex;align-items:flex-start;margin:12px 0 2px}
.lf2-node{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:50px}
.lf2-ring{width:21px;height:21px;border-radius:50%;border:2px solid #2a3a85;display:flex;align-items:center;justify-content:center;font-size:9px;background:#0a1233;color:#42549c}
.lf2-ring.lit{border-color:#f5c518;color:#f5c518;box-shadow:0 0 9px #f5c51866}
.lf2-ring.green{border-color:#4ade80;color:#4ade80;box-shadow:0 0 9px #4ade8066}
.lf2-seg{flex:1 1 6px;height:2px;background:#22307a;margin-top:10px}
.lf2-seg.lit{background:linear-gradient(90deg,#f5c518cc,#f5c51866);box-shadow:0 0 6px #f5c51844}
.lf2-nlab{font-size:6.8px;letter-spacing:.08em;color:#5d6fa8;margin-top:4px;font-weight:700;text-transform:uppercase;text-align:center}
.lf2-nsub{font-size:8px;color:#9fb3d9;margin-top:1px;font-weight:600}
.lf2-cardbot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:9.5px;letter-spacing:.04em;min-height:14px}
.lf2-warnbadge{color:#ff7b86;font-weight:700;font-size:9px;letter-spacing:.06em}
.lf2-feed{flex:1 1 285px;min-width:275px;background:linear-gradient(180deg,#0d1638,#0a1130);border:1px solid #22307a;border-radius:10px;padding:13px 14px;max-height:680px;display:flex;flex-direction:column}
.lf2-fh{font-size:10px;font-weight:700;letter-spacing:.24em;color:#f5c518;margin-bottom:10px;text-transform:uppercase}
.lf2-evs{overflow-y:auto;display:flex;flex-direction:column;gap:7px}
.lf2-ev{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:7px;border:1px solid transparent}
.lf2-ev.first{background:#13214f;border-color:#2a3a85}
.lf2-ev .ico{font-size:12px;line-height:15px}
.lf2-ev .x{font-size:10.5px;font-weight:600;line-height:1.35}
.lf2-ev .t{font-size:8.5px;color:#5d6fa8;margin-top:1px}
.lf2-empty{background:#0d1638;border:1px dashed #22307a;border-radius:10px;padding:34px 20px;text-align:center;color:#5d6fa8;font-size:12px;letter-spacing:.06em;grid-column:1/-1}
</style>
</head>
<body>
<div id="root"></div>

// ═══ ⚡ LIVE FEED · Service dept real-time job board (borrows lf2- visual language from index.html) ══════
// PT "now" in minutes-since-midnight, and a parser for "5:30p"-style stage time strings
// into minutes-since-midnight (also PT). Both share the same clock so elapsed-time math
// stays self-consistent even if the viewer's own machine is in a different timezone.
const ptNowMinutes=()=>{
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(new Date());
  const h=Number(parts.find(p=>p.type==="hour").value)%24;
  const m=Number(parts.find(p=>p.type==="minute").value);
  return h*60+m;
};
const parseStageTimeMinutes=str=>{
  if(typeof str!=="string") return null;
  const m=str.trim().match(/^(\d{1,2}):(\d{2})\s*([ap])m?$/i);
  if(!m) return null;
  let h=parseInt(m[1],10), mins=parseInt(m[2],10);
  const ap=m[3].toLowerCase();
  if(h<1||h>12||mins<0||mins>59) return null;
  if(ap==="p" && h!==12) h+=12;
  if(ap==="a" && h===12) h=0;
  return h*60+mins;
};
// evaluate John's red-alert rules for one job card; returns {alerts:[{code,label}], isAlert}
const evalJobAlerts=(j,nowMin)=>{
  const st=j.stages||{};
  const alerts=[];
  const onsiteRaw=st.onsite;
  const onsiteStr=typeof onsiteRaw==="string"?onsiteRaw:(onsiteRaw&&typeof onsiteRaw==="object"?onsiteRaw.t:null);
  const onsiteMin=parseStageTimeMinutes(onsiteStr);
  const doneNode=st.done, signedNode=st.signed;
  const isDone=doneNode!=null;
  const isSigned=!!(signedNode&&typeof signedNode==="object");
  let elapsedMin=null;
  if(onsiteMin!=null && nowMin!=null){
    let e=nowMin-onsiteMin;
    if(e>=0) elapsedMin=e; // negative => unparseable/skew guard: no elapsed-based alerts
  }
  // 1. LONG RUN — on site, not done/signed, elapsed > 90m
  if(elapsedMin!=null && !isDone && !isSigned && elapsedMin>90){
    const hrs=(elapsedMin/60).toFixed(1);
    alerts.push({code:"long",label:"⏱ "+hrs+"H ON SITE"});
  }
  // 2. LOW OPTIONS — <4 options AND (onsite>=45m OR signed/done)
  const optsNode=st.options;
  const optsCount=(optsNode&&typeof optsNode==="object")?(optsNode.n||0):0;
  const eligibleForOpts = (elapsedMin!=null && elapsedMin>=45) || isSigned || isDone;
  if(eligibleForOpts && optsCount<4){
    alerts.push({code:"opts",label:"OPTS "+optsCount+"/4"});
  }
  // 3. LOW PHOTOS — <30 AND (done OR onsite>=90m)
  const photos=j.photos!=null?j.photos:0;
  const eligibleForPhotos = isDone || (elapsedMin!=null && elapsedMin>=90);
  if(eligibleForPhotos && photos<30){
    alerts.push({code:"photos",label:"📷 "+photos+"/30"});
  }
  // 4. ZERO TICKET — done AND signed total is 0/absent
  if(isDone){
    const signedTotal=isSigned?(signedNode.total||0):0;
    if(!signedTotal){
      alerts.push({code:"zero",label:"$0 TICKET"});
    }
  }
  return {alerts,isAlert:alerts.length>0,isSigned};
};

  const load=()=>{
    fetch("servicefeed.json?_="+Date.now())
      .then(r=>{ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
      .then(d=>{
        const jobsArr=d.jobs||[];
        const nowSignedIds=new Set(jobsArr.filter(j=>{
          const sn=(j.stages||{}).signed;
          return !!(sn&&typeof sn==="object");
        }).map(j=>j.jobId));
        if(seenSignedRef.current==null){
          seenSignedRef.current=nowSignedIds; // first load: seed only, never flash
        } else {
          const newlySigned=[...nowSignedIds].filter(id=>!seenSignedRef.current.has(id));
          if(newlySigned.length){
            setFlashIds(prev=>{
              const next={...prev};
              newlySigned.forEach(id=>{ next[id]=true; });
              return next;
            });
            newlySigned.forEach(id=>{
              setTimeout(()=>{ setFlashIds(prev=>{ const n={...prev}; delete n[id]; return n; }); },3000);
            });

            {sold && <span style={{color:"#4ade80",fontWeight:800,border:"1px solid #4ade8088",background:"rgba(74,222,128,.12)",borderRadius:4,padding:"2px 7px"}}>{fmt$(soldTotal)}</span>}

            <div className="lf2-title">Sierra Air — Service Live Feed</div>
            <div className="lf2-subtl">{lf.day||""} {lf.date?"· "+lf.date:""}</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          {redAlertCount>0 && <div className="lf2-headalert">🔴 {redAlertCount} ALERT{redAlertCount===1?"":"S"}</div>}
          {stale
            ? <div className="lf2-chip-stale">⚠ FEED STALE · UPDATED {ageMin}M AGO</div>
            : <div className="lf2-chip-live"><span className="lf2-dot"/>LIVE · updated {ageMin!=null?ageMin+"m ago":"—"}</div>}
        </div>
      </div>

      <div className="lf2-kpis">
        <div className="lf2-kpi"><div className="l">JOBS TODAY</div><div className="v">{K.jobsToday||0}</div><div className="s">{jobs.filter(j=>j.status==="Done").length} completed</div></div>
        <div className="lf2-kpi"><div className="l">ON SITE NOW</div><div className="v" style={{color:"#4ade80"}}>{K.onSiteNow||0}</div><div className="s">crews active</div></div>
        <div className="lf2-kpi"><div className="l">OPTIONS IN PLAY</div><div className="v" style={{color:"#f5c518"}}>{fmt$(K.optionsInPlayTotal)}</div><div className="s">{K.optionsInPlayCount||0} options</div></div>
        <div className="lf2-kpi"><div className="l">SIGNED TODAY</div><div className="v" style={{color:"#4ade80"}}>{fmt$(K.signedTotal)}</div><div className="s">{K.signedJobs||0} jobs signed</div></div>
        <div className="lf2-kpi"><div className="l">LEADS SET</div><div className="v" style={{color:"#a78bfa"}}>{K.leadsSet||0}</div><div className="s">turnovers</div></div>
        <div className="lf2-kpi"><div className="l">MEMBERSHIPS SOLD</div><div className="v" style={{color:"#5BA4E6"}}>{K.membershipsSold||0}</div><div className="s">today</div></div>
      </div>

      <div className="lf2-bus">
        {teamsList.map(t=>(
          <button key={t} className={"lf2-bu"+(teamFilter===t?" on":"")} onClick={()=>setTeamFilter(t)}>{t}</button>
        ))}
      </div>

      <div className="lf2-main">
        <div className="lf2-grid">
          {sorted.length ? sorted.map(jobCard) : <div className="lf2-empty">No jobs match this filter.</div>}
        </div>
        <div className="lf2-feed">
          <div className="lf2-fh">◆ Live Activity</div>
          {activity.length ? (
            <div className="lf2-evs">
              {activity.map((ev,i)=>(
                <div key={i} className={"lf2-ev"+(i===0?" first":"")}>
                  <span className="ico">{ev.i}</span>
                  <div>
                    <div className="x" style={ev.c?{color:ev.c}:null}>{ev.x}</div>
                    <div className="t">{ev.t}</div>
                  </div>
                </div>
              ))}
            </div>
          ) : <div style={{color:"#5d6fa8",fontSize:11,padding:"10px 4px"}}>No activity yet.</div>}
        </div>
      </div>
    </div>
  );
}

// ═══ DEPARTMENT PULSE (new "overview" tab) — servicedata.json ══════
function ServicePulseTab({onClassic}){
  const [d,setD]=React.useState(null);
  const [err,setErr]=React.useState(false);
  const [win,setWin]=React.useState("today");
  const [now,setNow]=React.useState(Date.now());

  const load=()=>{
    fetch("servicedata.json?_="+Date.now())
      .then(r=>{ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
      .then(j=>{ setD(j); setErr(false); })
      .catch(()=>setErr(true));
  };
  React.useEffect(()=>{ load(); const id=setInterval(load,300000); const t=setInterval(()=>setNow(Date.now()),60000); return ()=>{clearInterval(id);clearInterval(t);}; },[]);

  if(!d){
    return (<div className="lf2-wrap riseIn" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"50vh"}}>
      <div style={{color:"#8fa3d9",fontSize:12,letterSpacing:"0.1em"}}>{err?"⚠ COULD NOT LOAD servicedata.json":"◆ LOADING DEPARTMENT PULSE…"}</div>
    </div>);
  }

  const BLUE="#5BA4E6",GREEN="#22c55e",GOLD="#F5B324",PURP="#a78bfa",RED="#E63946";
  // ── render-safety: coerce every value to a primitive before it ever hits JSX ──
  const numOr0=v=>(typeof v==="number"&&isFinite(v))?v:0;
  const str=v=>(v==null?"":String(v));
  const fmt=v=>{ v=numOr0(v); const av=Math.abs(v); return av>=1000000?"$"+(v/1000000).toFixed(2)+"M":av>=1000?"$"+Math.round(v/1000).toLocaleString()+"k":"$"+Math.round(v); };
  const fmtFull=v=>"$"+Math.round(numOr0(v)).toLocaleString();
  const fmtPct=v=>numOr0(v).toFixed(1)+"%";

  const WINS=[["today","TODAY"],["wtd","WTD"],["mtd","MTD"],["ytd","YTD"]];
  const W = (d[win] && typeof d[win]==="object" && !Array.isArray(d[win])) ? d[win] : {};
  const techRows = Array.isArray(d.techs && d.techs[win]) ? d.techs[win] : [];
  const board = (d.board && typeof d.board==="object") ? d.board : {};
  const monthly = Array.isArray(d.monthly) ? d.monthly : [];
  const revBU = (W.revenueBU && typeof W.revenueBU==="object" && !Array.isArray(W.revenueBU)) ? W.revenueBU : {};

  const updatedMs = d.updated ? Date.parse(d.updated) : null;
  const ageMin = (updatedMs && !isNaN(updatedMs)) ? Math.round((now-updatedMs)/60000) : null;
  const stale = ageMin!=null && ageMin>120;
  let dateStr="";
  try{ dateStr = updatedMs?new Date(updatedMs).toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"}):""; }catch(e){ dateStr=""; }

  const memPct = W.membershipConv!=null ? fmtPct(W.membershipConv) : "—";
  const memSub = (W.membershipsSold!=null && W.membershipOpps!=null) ? (numOr0(W.membershipsSold)+" / "+numOr0(W.membershipOpps)+" opps") : "";

  const kpis=[
    ["CLOSE RATE",fmtPct(W.closeRate),GREEN,(W.converted!=null&&W.opps!=null)?(numOr0(W.converted)+"/"+numOr0(W.opps)+" opps"):""],
    ["AVG SALE",fmtFull(W.avgSale),BLUE,""],
    ["AVG TICKET",fmtFull(W.avgTicket),BLUE,(W.jobs!=null?numOr0(W.jobs)+" jobs":"")],
    ["SALES",fmtFull(W.sales),GOLD,W.salesIsApprox?"approx (invoice lag)":"$ sold"],
    ["REVENUE",fmtFull(W.revenue),"#4ADE80","$ invoiced"],
    ["MEMBERSHIP %",memPct,PURP,memSub],
    ["LEADS SET",str(numOr0(W.leadsSet)),"#f5c518","turnovers"],
  ];

  // BY TECH — sort by sales desc
  const techSorted = techRows.slice().sort((a,b)=>numOr0(b.sales)-numOr0(a.sales));
  const memCell=t=>{
    const sold=numOr0(t.membershipsSold), opps=numOr0(t.membershipOpps);
    const pct = opps ? Math.round((sold/opps)*1000)/10 : 0;
    return sold+"/"+opps+" ("+pct.toFixed(1)+"%)";
  };

  // BU cards from window.revenueBU — only revenue is genuinely split by BU in this feed;
  // sales/close-rate/avg-sale/opps below the header line are department totals (not BU-split),
  // labeled as such rather than fabricated.
  const buEntries = Object.entries(revBU);
  const buTotal = buEntries.reduce((a,[,v])=>a+numOr0(v),0);
  const buLabel=k=>{ const s=str(k); const p=s.split(" - "); return (p[1]||s).toUpperCase(); };
  const buColor=k=>str(k).toLowerCase().includes("maint")?GREEN:BLUE;

  const sectionCard=(title,sub,body)=>(
    <div style={{padding:"14px 24px 0"}}><div className="liftCard" style={{background:"#131c30",border:"1px solid #1e2d47",borderRadius:16,padding:"16px 20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",flexWrap:"wrap",gap:6}}>
        <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>{title}</div>
        {sub&&<div style={{fontSize:9.5,color:"#6b7a99"}}>{sub}</div>}
      </div>{body}
    </div></div>);

  const chart1=()=>{
    if(!monthly.length) return <div style={{color:"#5d6fa8",fontSize:11,padding:"10px 4px"}}>No monthly data yet.</div>;
    const W_=760,H_=190,pL=46,pB=26,pT=18,pR=44,n=monthly.length;
    const mxRev=Math.max(1,...monthly.map(x=>numOr0(x.revenue)),...monthly.map(x=>numOr0(x.salesApprox)));
    const X=i=>pL+i*(W_-pL-pR)/Math.max(1,n-1);
    const Y=v=>pT+(1-Math.min(1,numOr0(v)/mxRev))*(H_-pT-pB);
    return (<svg viewBox={"0 0 "+W_+" "+H_} style={{width:"100%",height:"auto",overflow:"visible",marginTop:10}}>
      {[0,0.5,1].map((f,i)=>(<g key={i}><line x1={pL} y1={Y(mxRev*f)} x2={W_-pR} y2={Y(mxRev*f)} stroke="#1e2d47"/><text x={pL-5} y={Y(mxRev*f)+3} fontSize="8" fill="#4a5a70" textAnchor="end">{fmt(mxRev*f)}</text></g>))}
      {monthly.map((x,i)=>{ const bw=(W_-pL-pR)/n*0.5; const last=i===n-1; return (<g key={i}>
        <rect x={X(i)-bw/2} y={Y(x.revenue)} width={bw} height={(H_-pB)-Y(x.revenue)} rx="3" fill={last?"url(#pulsegrad)":"#2E78C7"} opacity={last?0.85:1}/>
        <text x={X(i)} y={H_-6} fontSize="8.5" fill={last?GOLD:"#7089ab"} textAnchor="middle">{str(x.month).slice(0,3)}{last?"*":""}</text>
      </g>);})}
      <defs><linearGradient id="pulsegrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={BLUE}/><stop offset="100%" stopColor="#2E78C7"/></linearGradient></defs>
      <path d={monthly.map((x,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(x.salesApprox).toFixed(1)).join(" ")} fill="none" stroke={GOLD} strokeWidth="2.2"/>
      {monthly.map((x,i)=>(<circle key={"s"+i} cx={X(i)} cy={Y(x.salesApprox)} r="2.6" fill={GOLD}/>))}
      <text x={W_-pR+6} y={pT+4} fontSize="8" fill={GOLD}>sales (approx)</text><text x={pL} y={pT-6} fontSize="8" fill={BLUE}>revenue</text>
    </svg>);
  };

  const chart2=()=>{
    if(!monthly.length) return <div style={{color:"#5d6fa8",fontSize:11,padding:"10px 4px"}}>No monthly data yet.</div>;
    const W_=760,H_=170,pL=40,pB=24,pT=16,pR=12,n=monthly.length;
    const X=i=>pL+i*(W_-pL-pR)/Math.max(1,n-1);
    const Y=v=>pT+(1-Math.max(0,Math.min(100,numOr0(v)))/100)*(H_-pT-pB);
    const line=key=>monthly.map((x,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(x[key]).toFixed(1)).join(" ");
    return (<svg viewBox={"0 0 "+W_+" "+H_} style={{width:"100%",height:"auto",overflow:"visible",marginTop:10}}>
      {[0,50,100].map((f,i)=>(<g key={i}><line x1={pL} y1={Y(f)} x2={W_-pR} y2={Y(f)} stroke="#1e2d47"/><text x={pL-5} y={Y(f)+3} fontSize="8" fill="#4a5a70" textAnchor="end">{f}%</text></g>))}
      <path d={line("closeRate")} fill="none" stroke={GREEN} strokeWidth="2.2"/>
      <path d={line("membershipConv")} fill="none" stroke={PURP} strokeWidth="2.2"/>
      {monthly.map((x,i)=>(<g key={i}>
        <circle cx={X(i)} cy={Y(x.closeRate)} r="2.6" fill={GREEN}/>
        <circle cx={X(i)} cy={Y(x.membershipConv)} r="2.6" fill={PURP}/>
        <text x={X(i)} y={H_-6} fontSize="8.5" fill="#7089ab" textAnchor="middle">{str(x.month).slice(0,3)}</text>
      </g>))}
      <text x={W_-pR+6} y={pT+4} fontSize="8" fill={GREEN}>close %</text><text x={pL} y={pT-6} fontSize="8" fill={PURP}>memb conv %</text>
    </svg>);
  };

  return (
    <div className="lf2-wrap riseIn">
      <div className="lf2-head">
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div className="lf2-logo">S</div>
          <div>
            <div className="lf2-title">Department Pulse — {dateStr||"—"} · live</div>
            <div className="lf2-subtl">HVAC SERVICE · {WINS.find(w=>w[0]===win)[1]} window</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <div className="lf2-bus" style={{padding:0}}>
            {WINS.map(([k,l])=>(<button key={k} className={"lf2-bu"+(win===k?" on":"")} onClick={()=>setWin(k)}>{l}</button>))}
          </div>
          <div style={{background:"rgba(91,164,230,.1)",border:"1px solid #5BA4E655",color:"#5BA4E6",borderRadius:6,padding:"5px 12px",fontWeight:700,fontSize:10,letterSpacing:".14em"}}>HVAC SERVICE · 2A/2B</div>
          {stale
            ? <div className="lf2-chip-stale">⚠ UPDATED {ageMin}M AGO</div>
            : <div className="lf2-chip-live"><span className="lf2-dot"/>updated {ageMin!=null?ageMin+"m ago":"—"}</div>}
          {onClassic && <button onClick={onClassic} style={{background:"transparent",border:"1px solid #1e2d47",color:"#6b7a99",borderRadius:6,padding:"5px 12px",fontFamily:"inherit",fontSize:9.5,fontWeight:700,letterSpacing:".1em",cursor:"pointer"}}>CLASSIC VIEW →</button>}
        </div>
      </div>

      <div className="lf2-kpis">
        {kpis.map(([l,v,c,s])=>(<div className="lf2-kpi" key={l}><div className="l">{l}</div><div className="v" style={{color:c}}>{v}</div>{s?<div className="s">{s}</div>:null}</div>))}
      </div>

      <div style={{padding:"14px 24px 0",display:"flex",gap:12,flexWrap:"wrap"}}>
        {[["MAINTENANCE ON BOARD",numOr0(board.maintenanceOnBoard),BLUE],["MAINTENANCE RAN",numOr0(board.maintenanceRan),GREEN],["DEMAND ON BOARD",numOr0(board.demandOnBoard),GOLD],["DEMAND RAN",numOr0(board.demandRan),GREEN]].map(([l,v,c])=>(
          <div key={l} className="liftCard" style={{flex:"1 1 150px",background:"#131c30",border:"1px solid #1e2d47",borderLeft:"3px solid "+c,borderRadius:13,padding:"10px 16px"}}>
            <div style={{fontSize:9,color:"#7089ab",letterSpacing:"0.1em",fontWeight:700}}>{l}</div>
            <div style={{fontSize:20,fontWeight:900,color:c,marginTop:3}}>{v}</div>
          </div>))}
      </div>

      {sectionCard("Business Units","revenue split · other metrics are department totals, not yet BU-split in the feed",
        <div style={{display:"flex",gap:12,flexWrap:"wrap",marginTop:10}}>
          {buEntries.length ? buEntries.map(([k,v])=>{
            const pct = buTotal ? Math.round((numOr0(v)/buTotal)*1000)/10 : 0;
            const c=buColor(k);
            return (<div key={k} className="liftCard" style={{flex:"1 1 220px",background:"linear-gradient(160deg,#131c30,#0e1626)",border:"1px solid #1e2d47",borderRadius:14,padding:"14px 18px"}}>
              <div style={{fontSize:10,letterSpacing:"0.14em",color:c,fontWeight:800}}>{buLabel(k)}</div>
              <div style={{fontSize:26,fontWeight:900,color:"#fff",marginTop:4}}>{fmtFull(v)}</div>
              <div style={{fontSize:9.5,color:"#6b7a99",marginTop:3}}>{pct}% of revenue · {WINS.find(w=>w[0]===win)[1]}</div>
              <div style={{fontSize:9,color:"#6b7a99",marginTop:8,paddingTop:8,borderTop:"1px solid #1e2d47"}}>Dept sales {fmtFull(W.sales)} · close {fmtPct(W.closeRate)} · opps {numOr0(W.opps)}</div>
            </div>);
          }) : <div style={{color:"#5d6fa8",fontSize:11}}>No BU revenue split in this window.</div>}
        </div>)}

      {sectionCard("By Tech · "+WINS.find(w=>w[0]===win)[1],techSorted.length+" reps · sorted by sales",
        techSorted.length ? (
          <div style={{overflowX:"auto",marginTop:10}}>
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:820}}>
              <thead><tr>
                {["TECH","TEAM","OPPS","CLOSE RATE","AVG SALE","SALES","MEM","LEADS SET","REVENUE","JOBS","AVG TICKET"].map((h,i)=>(
                  <th key={h} style={{padding:"8px",fontSize:9,color:"#9fb3cc",fontWeight:700,textAlign:i<2?"left":"right",borderBottom:"2px solid #1e2d47",whiteSpace:"nowrap"}}>{h}</th>))}
              </tr></thead>
              <tbody>
                {techSorted.map((t,i)=>(
                  <tr key={str(t.name)+i} style={i<3?{background:"rgba(245,195,24,.06)"}:null}>
                    <td style={{padding:"6px 8px",fontSize:11,color:"#e6eefb",fontWeight:i<3?800:500,whiteSpace:"nowrap"}}>{i<3?["🥇 ","🥈 ","🥉 "][i]:""}{str(t.name)||"—"}</td>
                    <td style={{padding:"6px 8px",fontSize:11,color:"#9fb3cc"}}>{str(t.team)||"—"}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:"#e6eefb"}}>{numOr0(t.opps)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:GREEN,fontWeight:700}}>{fmtPct(t.closeRate)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:"#e6eefb"}}>{fmtFull(t.avgSale)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:GOLD,fontWeight:800}}>{fmtFull(t.sales)}</td>
                    <td style={{padding:"6px 8px",fontSize:10.5,textAlign:"right",color:PURP}}>{memCell(t)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:"#e6eefb"}}>{numOr0(t.leadsSet)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:"#4ADE80"}}>{fmtFull(t.revenue)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:"#e6eefb"}}>{numOr0(t.jobs)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:"#e6eefb"}}>{fmtFull(t.avgTicket)}</td>
                  </tr>))}
              </tbody>
            </table>
          </div>
        ) : <div style={{color:"#5d6fa8",fontSize:11,padding:"10px 4px"}}>No tech activity in this window yet.</div>)}

      {sectionCard("Sales vs Revenue by Month","bars = completed revenue · line = approx sales · *current month partial",chart1())}
      {sectionCard("Close Rate & Membership Conversion by Month","opportunity close % vs membership conversion %",chart2())}
    </div>
  );
}

    ["CLOSE RATE", fmtPct(wtd.closeRate), GREEN, (wtd.converted!=null&&wtd.opps!=null)?(numOr0(wtd.converted)+"/"+numOr0(wtd.opps)+" opps"):""],
    ["AVG SALE", fmtFull(wtd.avgSale), BLUE, ""],
    ["SALES OPP", str(numOr0(wtd.opps)), BLUE, "opportunities WTD"],
    ["MEM SOLD", str(numOr0(wtd.membershipsSold)), PURP, wtd.membershipConv!=null?fmtPct(wtd.membershipConv)+" conv":""],
    ["RUN-RATE PROJECTION", fmtFull(runRate), "#4ADE80", "If Pace Holds All Week"],
  ];

  // ── daily sales progression: sum sales across techs per day ──
  const dailyTotals = days.map(day=>({
    day,
    sales: techEntries.reduce((a,t)=>a+numOr0(t.rows[day] && t.rows[day].sales),0),
  }));

  const dailyChart=()=>{
    if(!dailyTotals.length) return <div style={{color:"#5d6fa8",fontSize:11,padding:"10px 4px"}}>No days reported yet this week.</div>;
    const W_=760,H_=190,pL=46,pB=26,pT=18,pR=16,n=dailyTotals.length;
    const mx=Math.max(1,...dailyTotals.map(x=>x.sales));
    const X=i=>pL+i*(W_-pL-pR)/Math.max(1,n);
    const bw=(W_-pL-pR)/n*0.55;
    const Y=v=>pT+(1-Math.min(1,v/mx))*(H_-pT-pB);
    return (<svg viewBox={"0 0 "+W_+" "+H_} style={{width:"100%",height:"auto",overflow:"visible",marginTop:10}}>
      {[0,0.5,1].map((f,i)=>(<g key={i}><line x1={pL} y1={Y(mx*f)} x2={W_-pR} y2={Y(mx*f)} stroke="#1e2d47"/><text x={pL-5} y={Y(mx*f)+3} fontSize="8" fill="#4a5a70" textAnchor="end">{fmt(mx*f)}</text></g>))}
      {dailyTotals.map((x,i)=>{ const last=i===n-1; const cx=X(i)+bw/2+((W_-pL-pR)/n-bw)/2; return (<g key={i}>
        <rect x={cx-bw/2} y={Y(x.sales)} width={bw} height={(H_-pB)-Y(x.sales)} rx="3" fill={last?"url(#wkgrad)":"#2E78C7"} opacity={last?0.9:1}/>
        <text x={cx} y={Y(x.sales)-6} fontSize="8.5" fontWeight="700" fill={BLUE} textAnchor="middle">{fmt(x.sales)}</text>
        <text x={cx} y={H_-6} fontSize="8.5" fill={last?GOLD:"#7089ab"} textAnchor="middle">{dayLabel(x.day)}{last?"*":""}</text>
      </g>);})}
      <defs><linearGradient id="wkgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#5BA4E6"/><stop offset="100%" stopColor="#2E78C7"/></linearGradient></defs>
    </svg>);
  };

  // ── leaders ──
  const salesLeaders = techEntries.map(t=>({name:t.name, sales:numOr0(t.rows.weekTotal && t.rows.weekTotal.sales)}))
    .sort((a,b)=>b.sales-a.sales).slice(0,10);
  const closeLeaders = techEntries.map(t=>{
      const wt = t.rows.weekTotal || {};
      return {name:t.name, opps:numOr0(wt.opps), closeRate:numOr0(wt.closeRate)};
    }).filter(t=>t.opps>0).sort((a,b)=>b.closeRate-a.closeRate).slice(0,10);

  const rankBar=(list,valKey,color,fmtVal,subFn)=>{
    const mx=Math.max(1,...list.map(c=>c[valKey]||0));
    return (<div style={{display:"flex",flexDirection:"column",gap:8,marginTop:10}}>
      {list.length ? list.map((c,i)=>(<div key={c.name+i} style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:20,fontSize:11,fontWeight:800,color:i<3?GOLD:"#6b7a99",textAlign:"right"}}>{i+1}</div>
        <div style={{width:120,fontSize:11,color:"#cfeede",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{i===0?"🥇 ":i===1?"🥈 ":i===2?"🥉 ":""}{firstName(c.name)}</div>
        <div style={{flex:1,background:"#0a1220",borderRadius:5,height:16,overflow:"hidden"}}><div style={{width:Math.max(2,(c[valKey]||0)/mx*100)+"%",height:"100%",borderRadius:5,background:"linear-gradient(90deg,"+color+","+color+"aa)",animation:"growW 1s ease both"}}/></div>
        <div style={{width:76,fontSize:11,fontWeight:800,color:color,textAlign:"right"}}>{fmtVal(c[valKey])}</div>
        {subFn&&<div style={{width:60,fontSize:9.5,color:"#9fb3cc",textAlign:"right"}}>{subFn(c)}</div>}
      </div>)) : <div style={{color:"#5d6fa8",fontSize:11}}>No data yet.</div>}
    </div>);
  };

  // ── day-by-day detail table ──
  const dayChips = [...days.map(day=>({key:day,label:dayLabel(day)})), {key:"total",label:"WEEK TOTAL"}];
  const detailRows = techEntries.map(t=>{
    const wt = t.rows.weekTotal || {};
    const sortVal = selDay==="total" ? numOr0(wt.sales) : numOr0(t.rows[selDay] && t.rows[selDay].sales);
    return { name:t.name, rows:t.rows, weekTotal:wt, sortVal };
  }).sort((a,b)=>b.sortVal-a.sortVal);

  const closeColor=r=>r>=40?GREEN:RED;

  return (
    <div className="lf2-wrap riseIn">
      <div className="lf2-head">
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div className="lf2-logo">S</div>
          <div>
            <div className="lf2-title">Week To Date — {weekLabel}</div>
            <div className="lf2-subtl">HVAC SERVICE · {days.length} of 7 days reported</div>
          </div>
        </div>
        <div style={{background:"rgba(91,164,230,.1)",border:"1px solid #5BA4E655",color:"#5BA4E6",borderRadius:6,padding:"5px 12px",fontWeight:700,fontSize:10,letterSpacing:".14em"}}>HVAC SERVICE · 2A/2B</div>
      </div>

      <div className="lf2-kpis">
        {kpis.map(([l,v,c,s])=>(<div className="lf2-kpi" key={l}><div className="l">{l}</div><div className="v" style={{color:c}}>{v}</div>{s?<div className="s">{s}</div>:null}</div>))}
      </div>

      <div style={{padding:"14px 24px 0"}}><div className="liftCard" style={{background:"#131c30",border:"1px solid #1e2d47",borderRadius:16,padding:"16px 20px"}}>
        <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>Daily Sales Progression</div>
        <div style={{fontSize:9.5,color:"#6b7a99"}}>department sales sold, summed across techs per elapsed day</div>
        {dailyChart()}
      </div></div>

      <div style={{padding:"14px 24px 0",display:"flex",gap:12,flexWrap:"wrap"}}>
        <div className="liftCard" style={{flex:"1 1 340px",background:"#131c30",border:"1px solid #1e2d47",borderRadius:16,padding:"16px 20px"}}>
          <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>Sales Leaders</div>
          <div style={{fontSize:9.5,color:"#6b7a99"}}>WTD sales sold, top 10</div>
          {rankBar(salesLeaders,"sales",GOLD,v=>fmtFull(v))}
        </div>
        <div className="liftCard" style={{flex:"1 1 340px",background:"#131c30",border:"1px solid #1e2d47",borderRadius:16,padding:"16px 20px"}}>
          <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>Close Rate Leaders</div>
          <div style={{fontSize:9.5,color:"#6b7a99"}}>WTD opp close %, top 10 (opps &gt; 0)</div>
          {rankBar(closeLeaders,"closeRate",GREEN,v=>fmtPct(v),c=>numOr0(c.opps)+" opps")}
        </div>
      </div>

      <div style={{padding:"14px 24px 0"}}><div className="liftCard" style={{background:"#131c30",border:"1px solid #1e2d47",borderRadius:16,padding:"16px 20px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",flexWrap:"wrap",gap:6}}>
          <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>Tech Day-By-Day Detail</div>
          <div style={{fontSize:9.5,color:"#6b7a99"}}>{techEntries.length} techs · sorted by selected column</div>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:10}}>
          {dayChips.map(c=>(<button key={c.key} onClick={()=>setSelDay(c.key)} className={"lf2-bu"+(selDay===c.key?" on":"")}>{c.label}</button>))}
        </div>
        {detailRows.length ? (
          <div style={{overflowX:"auto",marginTop:12}}>
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:820}}>
              <thead><tr>
                <th style={{padding:"8px",fontSize:9,color:"#9fb3cc",fontWeight:700,textAlign:"right",borderBottom:"2px solid #1e2d47"}}>#</th>
                <th style={{padding:"8px",fontSize:9,color:"#9fb3cc",fontWeight:700,textAlign:"left",borderBottom:"2px solid #1e2d47"}}>TECH</th>
                {days.map(day=>(<th key={day} style={{padding:"8px",fontSize:9,color:"#9fb3cc",fontWeight:700,textAlign:"right",borderBottom:"2px solid #1e2d47",whiteSpace:"nowrap"}}>{dayLabel(day)}</th>))}
                <th style={{padding:"8px",fontSize:9,color:"#9fb3cc",fontWeight:700,textAlign:"right",borderBottom:"2px solid #1e2d47",whiteSpace:"nowrap"}}>WTD TOTAL</th>
                <th style={{padding:"8px",fontSize:9,color:"#9fb3cc",fontWeight:700,textAlign:"right",borderBottom:"2px solid #1e2d47",whiteSpace:"nowrap"}}>WTD CLOSE</th>
                <th style={{padding:"8px",fontSize:9,color:"#9fb3cc",fontWeight:700,textAlign:"right",borderBottom:"2px solid #1e2d47",whiteSpace:"nowrap"}}>MEM SOLD</th>
              </tr></thead>
              <tbody>
                {detailRows.map((t,i)=>{
                  const cr = numOr0(t.weekTotal.closeRate);
                  return (<tr key={t.name+i} style={i<3?{background:"rgba(245,195,24,.06)"}:null}>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:i<3?GOLD:"#6b7a99",fontWeight:800}}>{i+1}</td>
                    <td style={{padding:"6px 8px",fontSize:11,color:"#e6eefb",fontWeight:i<3?800:500,whiteSpace:"nowrap"}}>{i<3?["🥇 ","🥈 ","🥉 "][i]:""}{str(t.name)||"—"}</td>
                    {days.map(day=>{
                      const rec = t.rows[day];
                      const s = rec && rec.sales!=null ? numOr0(rec.sales) : null;
                      return (<td key={day} style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:"#e6eefb"}}>{rec ? fmtFull(s) : "–"}</td>);
                    })}
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:GOLD,fontWeight:800}}>{fmtFull(t.weekTotal.sales)}</td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right"}}>
                      <span style={{padding:"2px 8px",borderRadius:5,fontWeight:800,fontSize:10.5,color:closeColor(cr),background:closeColor(cr)+"1a",border:"1px solid "+closeColor(cr)+"55"}}>{fmtPct(cr)}</span>
                    </td>
                    <td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:PURP}}>{numOr0(t.weekTotal.membershipsSold)}</td>
                  </tr>);
                })}
              </tbody>
            </table>
          </div>
        ) : <div style={{color:"#5d6fa8",fontSize:11,padding:"10px 4px"}}>No tech activity reported yet this week.</div>}
      </div></div>

      <div style={{padding:"14px 24px 0"}}><div className="liftCard" style={{background:"#131c30",border:"1px solid #1e2d47",borderRadius:16,padding:"16px 20px"}}>
        <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>Week Over Week</div>
        <div style={{fontSize:9.5,color:"#6b7a99"}}>sales sold vs revenue invoiced · last 9 weeks</div>
        {weekly.length>=2 ? (()=>{
          const W_=760,H_=210,pL=48,pB=30,pT=18,pR=16,n=weekly.length;
          const mx=Math.max(1,...weekly.map(x=>numOr0(x.sales)),...weekly.map(x=>numOr0(x.revenue)));
          const X=i=>pL+i*(W_-pL-pR)/Math.max(1,n-1);
          const Y=v=>pT+(1-Math.min(1,numOr0(v)/mx))*(H_-pT-pB);
          const lineSales = weekly.map((x,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(x.sales).toFixed(1)).join(" ");
          const lineRev = weekly.map((x,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(x.revenue).toFixed(1)).join(" ");
          const areaSales = lineSales+" L "+X(n-1).toFixed(1)+" "+(H_-pB)+" L "+pL+" "+(H_-pB)+" Z";
          return (<svg viewBox={"0 0 "+W_+" "+H_} style={{width:"100%",height:"auto",overflow:"visible",marginTop:10}}>
            <defs><linearGradient id="wowgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={GOLD} stopOpacity="0.28"/><stop offset="100%" stopColor={GOLD} stopOpacity="0"/></linearGradient></defs>
            {[0,0.5,1].map((f,i)=>(<g key={i}><line x1={pL} y1={Y(mx*f)} x2={W_-pR} y2={Y(mx*f)} stroke="#1e2d47"/><text x={pL-5} y={Y(mx*f)+3} fontSize="8" fill="#4a5a70" textAnchor="end">{fmt(mx*f)}</text></g>))}
            <path d={areaSales} fill="url(#wowgrad)"/>
            <path d={lineRev} fill="none" stroke={BLUE} strokeWidth="2.2"/>
            <path d={lineSales} fill="none" stroke={GOLD} strokeWidth="2.4"/>
            {weekly.map((x,i)=>{ const isCur=i===n-1; return (<g key={i}>
              <circle cx={X(i)} cy={Y(x.revenue)} r="2.6" fill={BLUE}/>
              <circle cx={X(i)} cy={Y(x.sales)} r={isCur?4:2.8} fill={isCur?"#4ADE80":GOLD}/>
              <text x={X(i)} y={Y(x.sales)-8} fontSize="8" fontWeight="700" fill={isCur?"#4ADE80":GOLD} textAnchor="middle">{fmt(x.sales)}{x.salesIsApprox?"*":""}</text>
              <text x={X(i)} y={H_-14} fontSize="8" fill={isCur?"#4ADE80":"#7089ab"} textAnchor="middle" transform={"rotate(0 "+X(i)+" "+(H_-14)+")"}>{str(x.label)}</text>
            </g>);})}
            <text x={W_-pR+6} y={pT+4} fontSize="8" fill={GOLD}>sales</text>
            <text x={pL} y={pT-6} fontSize="8" fill={BLUE}>revenue</text>
          </svg>);
        })() : <div style={{color:"#5d6fa8",fontSize:11,padding:"10px 4px"}}>Not enough weekly history yet.</div>}
        <div style={{fontSize:8.5,color:"#5d6fa8",marginTop:6}}>* past-week sales figures are report-approximated (invoice lag); the current week is exact.</div>
      </div></div>
    </div>
  );
}

// ═══ HVAC SERVICE · standalone command deck (Field Conversion + IAQ reports) ══════
const SVC=(typeof SERVICE_DATA!=="undefined")?SERVICE_DATA:{techs:[],dept:{},teams:[],iaqMonthly:[],months:[],dateRange:"",source:"",iaqTotal:0,elapsedFrac:0.5};
function ServiceDash(){
  const D=SVC; const teams=D.teams||[]; const iaqMo=D.iaqMonthly||[]; const monthly=D.monthly||[];
  const [tab,setTab]=React.useState("overview");

  const fmt=v=>v>=1000000?"$"+(v/1000000).toFixed(2)+"M":v>=1000?"$"+Math.round(v/1000).toLocaleString()+"k":"$"+Math.round(v||0);
  const BLUE="#5BA4E6",GREEN="#22c55e",GOLD="#F5B324";
  const col=r=>r>=45?"#22c55e":r>=30?"#F5B324":"#E63946";
  const gArc=frac=>{const R=58,cx=80,cy=92,a0=Math.PI,a1=Math.PI*(1-Math.max(0,Math.min(1,frac)));
    const x0=cx+R*Math.cos(a0),y0=cy-R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy-R*Math.sin(a1);
    return "M "+x0.toFixed(1)+" "+y0.toFixed(1)+" A "+R+" "+R+" 0 0 1 "+x1.toFixed(1)+" "+y1.toFixed(1);};
  const gTick=frac=>{const R=58,cx=80,cy=92,a=Math.PI*(1-frac);
    return {x1:(cx+(R-9)*Math.cos(a)).toFixed(1),y1:(cy-(R-9)*Math.sin(a)).toFixed(1),x2:(cx+(R+9)*Math.cos(a)).toFixed(1),y2:(cy-(R+9)*Math.sin(a)).toFixed(1)};};
  const gauge=(label,rate,bench,c)=>{const t=bench!=null?gTick(Math.min(bench,100)/100):null; return (
    <div className="riseIn liftCard" style={{background:"linear-gradient(160deg,#131c30,#0e1626)",border:"1px solid #1e2d47",borderRadius:16,padding:"12px 10px",flex:"1 1 150px",minWidth:148,textAlign:"center"}}>
      <div style={{fontSize:9,letterSpacing:"0.13em",color:"#7089ab",fontWeight:700}}>{label}</div>
      <svg viewBox="0 0 160 104" width="100%">
        <path d={gArc(1)} fill="none" stroke="#22304d" strokeWidth="12" strokeLinecap="round"/>
        <path d={gArc((rate||0)/100)} fill="none" stroke={c} strokeWidth="12" strokeLinecap="round" style={{filter:"drop-shadow(0 0 5px "+c+"88)"}}/>
        {t&&<line x1={t.x1} y1={t.y1} x2={t.x2} y2={t.y2} stroke="#4ADE80" strokeWidth="2.5" strokeLinecap="round"/>}
        <text x="80" y="84" textAnchor="middle" fontSize="26" fontWeight="900" fill={c}>{rate}%</text>
      </svg>
      {bench!=null&&<div style={{fontSize:8,color:"#6b7a99",marginTop:-4}}>target {bench}%</div>}
    </div>);};
  const tile=(label,val,accent,sub)=>(
    <div className="riseIn liftCard" style={{flex:"1 1 158px",background:"#131c30",border:"1px solid #1e2d47",borderLeft:"3px solid "+accent,borderRadius:13,padding:"13px 16px"}}>
      <div style={{fontSize:9,color:"#7089ab",letterSpacing:"0.1em",fontWeight:700}}>{label}</div>
      <div style={{fontSize:23,fontWeight:900,color:accent,marginTop:3}}>{val}</div>
      {sub&&<div style={{fontSize:9,color:"#6b7a99",marginTop:2}}>{sub}</div>}
    </div>);
  const card=(title,sub,body)=>(
    <div style={{padding:"14px 24px 0"}}><div className="liftCard" style={{background:"#131c30",border:"1px solid #1e2d47",borderRadius:16,padding:"16px 20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",flexWrap:"wrap",gap:6}}>
        <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>{title}</div>
        {sub&&<div style={{fontSize:9.5,color:"#6b7a99"}}>{sub}</div>}
      </div>{body}
    </div></div>);
  const rankBar=(list,valKey,color,fmtVal,subFn)=>{ const mx=Math.max(1,...list.map(c=>c[valKey]||0));
    return (<div style={{display:"flex",flexDirection:"column",gap:8,marginTop:10}}>
      {list.map((c,i)=>(<div key={c.name} style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:20,fontSize:11,fontWeight:800,color:i<3?GOLD:"#6b7a99",textAlign:"right"}}>{i+1}</div>
        <div style={{width:150,fontSize:11,color:"#cfeede",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{i===0?"🥇 ":i===1?"🥈 ":i===2?"🥉 ":""}{c.name}</div>
        <div style={{flex:1,background:"#0a1220",borderRadius:5,height:16,overflow:"hidden"}}><div style={{width:Math.max(2,(c[valKey]||0)/mx*100)+"%",height:"100%",borderRadius:5,background:"linear-gradient(90deg,"+color+","+color+"aa)",animation:"growW 1s ease both"}}/></div>
        <div style={{width:76,fontSize:11,fontWeight:800,color:color,textAlign:"right"}}>{fmtVal(c[valKey])}</div>
        {subFn&&<div style={{width:74,fontSize:9.5,color:"#9fb3cc",textAlign:"right"}}>{subFn(c)}</div>}
      </div>))}
    </div>);};
  const TABS=[
    {id:"live",icon:"⚡",label:"LIVE",sub:"Real-time jobs"},
    {id:"overview",icon:"🛠",label:"OVERVIEW",sub:"Dept KPIs"},
    {id:"weekly",icon:"📅",label:"WEEKLY",sub:"WTD + trends"},
    {id:"trend",icon:"📈",label:"TREND",sub:"Month over month"},
    {id:"board",icon:"🏆",label:"LEADERBOARD",sub:"All "+techs.length},
    {id:"conv",icon:"🎯",label:"CONVERSION",sub:"Opportunity %"},
    {id:"memb",icon:"🎟",label:"MEMBERSHIPS",sub:"Sold + conv"},
    {id:"iaq",icon:"💨",label:"IAQ",sub:"Air quality $"},
    {id:"teams",icon:"👥",label:"TEAMS",sub:"By crew"},
  ];
  React.useEffect(()=>{ if(!kiosk) return; const ids=TABS.map(t=>t.id); const id=setInterval(()=>setTab(c=>ids[(ids.indexOf(c)+1)%ids.length]),9000); return ()=>clearInterval(id); },[kiosk]);
  const top=techs.length?techs[0]:{name:"—",rev:0};
  const proj=period==="ytd"&&dept.rev&&D.elapsedFrac?Math.round(dept.rev/D.elapsedFrac):0;
  const momChart=()=>{ const m=monthly; if(m.length<2) return null; const W=760,H=190,pL=46,pB=26,pT=18,pR=44; const mx=Math.max(1,...m.map(x=>x.rev));
    const X=i=>pL+i*(W-pL-pR)/(m.length-1), Y=v=>pT+(1-v/mx)*(H-pT-pB), Yc=v=>pT+(1-v/60)*(H-pT-pB);
    return (<svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height:"auto",overflow:"visible",marginTop:10}}>
      {[0,0.5,1].map((f,i)=>(<g key={i}><line x1={pL} y1={Y(mx*f)} x2={W-pR} y2={Y(mx*f)} stroke="#1e2d47"/><text x={pL-5} y={Y(mx*f)+3} fontSize="8" fill="#4a5a70" textAnchor="end">{fmt(mx*f)}</text></g>))}
      {m.map((x,i)=>{const last=i===m.length-1; const bw=(W-pL-pR)/m.length*0.5; return (<g key={i}>
        <rect x={X(i)-bw/2} y={Y(x.rev)} width={bw} height={(H-pB)-Y(x.rev)} rx="3" fill={last?"url(#svcpar)":"#2E78C7"} opacity={last?0.85:1}/>
        <text x={X(i)} y={Y(x.rev)-5} fontSize="8.5" fontWeight="700" fill="#5BA4E6" textAnchor="middle">{fmt(x.rev)}</text>
        <text x={X(i)} y={H-6} fontSize="8.5" fill={last?GOLD:"#7089ab"} textAnchor="middle">{x.month.slice(0,3)}{last?"*":""}</text></g>);})}
      <defs><linearGradient id="svcpar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#5BA4E6"/><stop offset="100%" stopColor="#2E78C7"/></linearGradient></defs>
      <path d={m.map((x,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Yc(x.conv).toFixed(1)).join(" ")} fill="none" stroke={GOLD} strokeWidth="2" strokeDasharray="1 0"/>
      {m.map((x,i)=>(<g key={"c"+i}><circle cx={X(i)} cy={Yc(x.conv)} r="2.6" fill={GOLD}/><text x={X(i)} y={Yc(x.conv)-6} fontSize="7.5" fontWeight="700" fill={GOLD} textAnchor="middle">{x.conv}%</text></g>))}
      <text x={W-pR+6} y={pT+4} fontSize="8" fill={GOLD}>conv %</text><text x={pL} y={pT-6} fontSize="8" fill="#5BA4E6">revenue</text>
    </svg>);};
  const teamSplit=teams.map(t=>({...t,pct:dept.rev?Math.round(t.rev/dept.rev*100):0}));
  const iaqTot=D.iaqTotal||0;
  const optAll=(()=>{const o=techs.reduce((a,t)=>a+(t.opo||0)*(t.opp||0),0),d=techs.reduce((a,t)=>a+(t.opp||0),0);return d?Math.round(o/d*100)/100:0;})();
  const totConvAll=(()=>{const s=techs.reduce((a,t)=>a+(t.totalConv||0)*(t.jobs||0),0),d=techs.reduce((a,t)=>a+(t.jobs||0),0);return d?Math.round(s/d*10)/10:0;})();
  const cols=[["rev","Revenue"],["jobs","Jobs"],["opp","Opps"],["conv","Opp %"],["totalConv","Total %"],["opo","Opt/Opp"],["jobAvg","Job Avg"],["mSold","Memb"],["mConv","Memb %"],["leads","Leads"],["iaq","IAQ $"]];
  const tableRows=[...techs].filter(c=>!search||c.name.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>(b[sortCol]||0)-(a[sortCol]||0));
  const thc=(k,l)=>(<th onClick={()=>setSortCol(k)} style={{padding:"8px",fontSize:9,color:sortCol===k?BLUE:"#9fb3cc",fontWeight:700,textAlign:"right",borderBottom:"2px solid #1e2d47",whiteSpace:"nowrap",cursor:"pointer",position:"sticky",top:0,background:"#111827"}}>{l}{sortCol===k?" ▾":""}</th>);
  const tdN=(v,c,b)=>(<td style={{padding:"6px 8px",fontSize:11,textAlign:"right",color:c||"#e6eefb",fontWeight:b?800:500,whiteSpace:"nowrap"}}>{v}</td>);
  const csv=()=>{ const H=["Tech","Team","Revenue","Jobs","Opps","OppConv%","JobAvg","MembSold","MembConv%","LeadsSet","IAQ"];
    const rws=[...techs].sort((a,b)=>b.rev-a.rev).map(c=>[c.name,c.team,c.rev,c.jobs,c.opp,c.conv,c.jobAvg,c.mSold,c.mConv,c.leads,c.iaq]);
    const s=[H,...rws].map(r=>r.join(",")).join("\n"); const a=document.createElement("a");
    a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(s); a.download="hvac_service.csv"; a.click(); };
  const iaqChart=()=>{ const m=iaqMo; if(m.length<2) return null; const W=760,H=170,pL=44,pB=24,pT=16,pR=12; const mx=Math.max(1,...m.map(x=>x.total));
    const X=i=>pL+i*(W-pL-pR)/(m.length-1), Y=v=>pT+(1-v/mx)*(H-pT-pB);
    const line=m.map((x,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(x.total).toFixed(1)).join(" ");
    const area=line+" L "+X(m.length-1).toFixed(1)+" "+(H-pB)+" L "+pL+" "+(H-pB)+" Z";
    return (<svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height:"auto",overflow:"visible",marginTop:10}}>
      <defs><linearGradient id="iaqg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={BLUE} stopOpacity="0.3"/><stop offset="100%" stopColor={BLUE} stopOpacity="0"/></linearGradient></defs>
      {[0,0.5,1].map((f,i)=>(<g key={i}><line x1={pL} y1={Y(mx*f)} x2={W-pR} y2={Y(mx*f)} stroke="#1e2d47"/><text x={pL-5} y={Y(mx*f)+3} fontSize="8" fill="#4a5a70" textAnchor="end">{fmt(mx*f)}</text></g>))}
      <path d={area} fill="url(#iaqg)"/><path d={line} fill="none" stroke={BLUE} strokeWidth="2.4" strokeLinejoin="round"/>
      {m.map((x,i)=>(<g key={i}><circle cx={X(i)} cy={Y(x.total)} r={i===m.length-1?4:2.4} fill={i===m.length-1?GOLD:BLUE}/><text x={X(i)} y={Y(x.total)-9} fontSize="8.5" fontWeight="700" fill={BLUE} textAnchor="middle">{fmt(x.total)}</text><text x={X(i)} y={H-6} fontSize="8.5" fill="#7089ab" textAnchor="middle">{x.month.slice(0,3)}</text></g>))}
    </svg>);};

  return (
    <div className="riseIn" style={{padding:"0 0 40px"}}>
      <div style={{padding:"14px 24px",background:"linear-gradient(135deg,#0e1f33,#12263f)",borderBottom:"1px solid #1e3050",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>

          <div style={{fontSize:9,color:BLUE,fontWeight:700,letterSpacing:"0.2em"}}>🛠 HVAC SERVICE · COMMAND DECK</div>

        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <div style={{display:"flex",background:"#0e1626",borderRadius:8,padding:2,border:"1px solid #1e3050"}}>

          </div>

        </div>
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",padding:"12px 24px",background:"#0c1626",borderBottom:"1px solid #1e2d47"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",flexDirection:"column",alignItems:"flex-start",border:"none",cursor:"pointer",fontFamily:"inherit",
            background:tab===t.id?"linear-gradient(135deg,#16283f,#0f1f33)":"#0e1626",borderRadius:10,padding:"7px 13px",borderBottom:tab===t.id?"2px solid "+BLUE:"2px solid transparent"}}>
            <span style={{fontSize:11.5,fontWeight:800,color:tab===t.id?"#fff":"#9fb3cc"}}>{t.icon} {t.label}</span>
            <span style={{fontSize:8,color:tab===t.id?BLUE:"#5a6b85",fontWeight:600}}>{t.sub}</span>
          </button>))}
      </div>

      <div className="tab-fade" key={tab}>
        {tab==="live" && <ServiceLiveTab/>}
        {tab==="weekly" && <ServiceWeeklyTab/>}
        {tab==="overview" && !showClassic && <ServicePulseTab onClassic={()=>setShowClassic(true)}/>}
        {tab==="overview" && showClassic && (<React.Fragment>
          <div style={{padding:"9px 24px 0",display:"flex",justifyContent:"flex-end"}}>
            <button onClick={()=>setShowClassic(false)} style={{background:"transparent",border:"1px solid #1e2d47",color:"#6b7a99",borderRadius:6,padding:"5px 12px",fontFamily:"inherit",fontSize:9.5,fontWeight:700,letterSpacing:".1em",cursor:"pointer"}}>← PULSE VIEW</button>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",rowGap:6,padding:"9px 24px",background:"linear-gradient(90deg,#0a1524,#0e2033)",borderBottom:"1px solid #1e3050"}}>
            {[{l:"SERVICE REV",v:fmt(dept.rev),c:BLUE},{l:"OPP CONV",v:dept.conv+"%",c:GOLD},{l:"MEMBERSHIPS",v:dept.memb,c:GREEN},{l:"IAQ SOLD",v:fmt(iaqTot),c:"#4ADE80"},{l:"LEADS SET",v:dept.leads,c:"#a78bfa"},{l:"TOP TECH",v:top.name.split(" ")[0]+" "+fmt(top.rev),c:BLUE}].map((t,i)=>(<React.Fragment key={i}>
              {i>0&&<span style={{color:"#2a3f5a",margin:"0 12px"}}>◆</span>}
              <span style={{fontSize:12.5,fontWeight:800,color:t.c}}>{t.v}</span><span style={{fontSize:8.5,color:"#6b7a99",marginLeft:5,letterSpacing:"0.08em"}}>{t.l}</span>
            </React.Fragment>))}
          </div>
          <div style={{padding:"16px 24px 0",display:"flex",gap:14,flexWrap:"wrap"}}>
            <div className="riseIn liftCard" style={{flex:"2 1 340px",background:"linear-gradient(135deg,#0e2033,#0c1a2e)",border:"1px solid #1e3050",borderRadius:18,padding:"20px 24px",display:"flex",flexDirection:"column",justifyContent:"center"}}>
              <div style={{fontSize:10,letterSpacing:"0.16em",color:BLUE,fontWeight:800}}>COMPLETED SERVICE REVENUE · {D.dateRange}</div>
              <div style={{fontSize:50,fontWeight:900,color:"#fff",lineHeight:1.02,margin:"6px 0"}}>{fmt(dept.rev)}</div>
              <div style={{fontSize:11,color:"#9fb3cc",marginBottom:12}}>{dept.techs} techs · {(dept.jobs||0).toLocaleString()} jobs · {dept.conv}% opp conversion · proj {fmt(proj)} EOY</div>
              <div style={{display:"flex",height:22,borderRadius:7,overflow:"hidden",background:"#0a1220"}}>
                {teamSplit.map((t,i)=>(<div key={i} title={t.label+" "+fmt(t.rev)} style={{width:t.pct+"%",background:["linear-gradient(90deg,#2E78C7,#5BA4E6)","linear-gradient(90deg,#F5B324,#c98f14)","linear-gradient(90deg,#12833f,#22c55e)"][i%3],display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:800,color:"#fff",overflow:"hidden",whiteSpace:"nowrap"}}>{t.pct>10?t.pct+"%":""}</div>))}
              </div>
              <div style={{fontSize:8.5,color:"#6b7a99",marginTop:5}}>{teamSplit.map(t=>t.label+" "+t.pct+"%").join(" · ")}</div>
            </div>
            {gauge("OPP CONVERSION",dept.conv,45,col(dept.conv))}
            {gauge("MEMBERSHIP CONV",dept.membConv,30,col((dept.membConv||0)+15))}
          </div>
          <div style={{padding:"14px 24px 0",display:"flex",gap:12,flexWrap:"wrap"}}>
            {tile("MEMBERSHIPS SOLD",dept.memb,GREEN,dept.membConv+"% of "+(dept.membOpp||0).toLocaleString()+" opps")}
            {tile("LEADS SET",(dept.leads||0).toLocaleString(),"#a78bfa","turnovers to ROPP")}
            {tile("IAQ SOLD",fmt(iaqTot),"#4ADE80","air-quality revenue")}
            {tile("JOB AVERAGE",fmt(dept.jobAvg),GOLD,"per converted opp")}
            {tile("REV / BILLABLE HR",fmt(dept.revPerHr),BLUE,"efficiency")}
            {tile("OPTIONS / OPP",optAll,"#a78bfa","presented per opportunity")}
            {tile("TOTAL CONVERSION",totConvAll+"%",GOLD,"incl. non-opportunity jobs")}
          </div>
          {card("Top Service Techs · Completed Revenue","top 12 by revenue",rankBar(techs.slice(0,12),"rev",BLUE,fmt,c=>c.conv+"% conv"))}
          {iaqMo.length>1 && card("IAQ Sold by Month","indoor-air-quality revenue trend · *Jul partial",iaqChart())}
        </React.Fragment>)}

        {tab==="trend" && (<React.Fragment>
          <div style={{padding:"16px 24px 0",display:"flex",gap:12,flexWrap:"wrap"}}>
            {(()=>{ const full=monthly.slice(0,-1); const best=full.length?full.reduce((a,b)=>b.rev>a.rev?b:a):{month:"—",rev:0};
              const avg=full.length?Math.round(full.reduce((a,b)=>a+b.rev,0)/full.length):0;
              const last2=full.slice(-2); const prevMo=last2[0]||{rev:0,month:""}, curMo=last2[1]||{rev:0,month:""};
              const mom=prevMo.rev?Math.round((curMo.rev-prevMo.rev)/prevMo.rev*100):0;
              const momLabel=(curMo.month?curMo.month.slice(0,3):"")+" vs "+(prevMo.month?prevMo.month.slice(0,3):"");
              const mtdMonth=monthly[monthly.length-1]||{rev:0};
              const mtdLabel=D.mtdRange||"month to date · partial";
              return (<React.Fragment>
                {tile("BEST MONTH",best.month.slice(0,3),GOLD,fmt(best.rev))}
                {tile("AVG / MONTH",fmt(avg),"#4ADE80","full months")}
                {tile("LAST MoM",(mom>=0?"▲ ":"▼ ")+Math.abs(mom)+"%",mom>=0?"#4ADE80":"#E63946",momLabel)}
                {tile("JULY MTD",fmt(mtdMonth.rev||0),BLUE,mtdLabel)}
              </React.Fragment>);})()}
          </div>
          {card("Service Revenue — month over month",<span><span style={{color:"#5BA4E6"}}>▬</span> completed revenue&nbsp;<span style={{color:"#F5B324"}}>▬</span> opp conversion % · *Jul partial</span>,momChart())}
          {card("Memberships & IAQ by Month","memberships sold + IAQ revenue per month",
            <div style={{display:"flex",alignItems:"flex-end",gap:12,height:170,marginTop:12}}>
              {(()=>{ const mx=Math.max(1,...monthly.map(m=>m.memb)); return monthly.map((m,i)=>{const last=i===monthly.length-1;
                return (<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",height:"100%"}}>
                  <div style={{fontSize:9,fontWeight:800,color:"#22c55e",marginBottom:2}}>{m.memb}</div>
                  <div style={{fontSize:8,color:"#4ADE80",marginBottom:3}}>{fmt(m.iaq)}</div>
                  <div style={{width:"56%",height:Math.max(3,m.memb/mx*120)+"px",borderRadius:"5px 5px 0 0",background:last?"linear-gradient(180deg,#F5B324,#c98f14)":"linear-gradient(180deg,#22c55e,#12833f)"}}/>
                  <div style={{fontSize:8.5,color:last?"#F5B324":"#7089ab",marginTop:6}}>{m.month.slice(0,3)}{last?"*":""}</div>
                </div>);});})()}
            </div>)}
        </React.Fragment>)}

        {tab==="board" && (
          <div style={{padding:"14px 24px 0"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:10}}>

                <button onClick={csv} style={{background:"rgba(91,164,230,.12)",border:"1px solid "+BLUE+"55",color:BLUE,borderRadius:8,padding:"6px 12px",cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700}}>⬇ CSV</button>
              </div>
            </div>
            <div className="liftCard" style={{background:"#131c30",border:"1px solid #1e2d47",borderRadius:16,overflow:"auto",maxHeight:560}}>

                <thead><tr>
                  <th style={{padding:"8px",fontSize:9,color:"#9fb3cc",textAlign:"left",borderBottom:"2px solid #1e2d47",position:"sticky",top:0,background:"#111827"}}>#</th>

                  {cols.map(c=>thc(c[0],c[1]))}
                </tr></thead>
                <tbody>
                  {tableRows.map((c,i)=>(
                    <tr key={c.name} className="trow" style={{background:i%2?"#141c2e":"transparent",borderTop:"1px solid #111827"}}>
                      {tdN(i+1,"#6b7a99")}

                    </tr>))}
                </tbody>
              </table>
            </div>
          </div>)}

        {tab==="conv" && (<React.Fragment>
          <div style={{padding:"16px 24px 0",display:"flex",gap:14,flexWrap:"wrap"}}>

              {tile("DEPT OPP CONVERSION",dept.conv+"%",GOLD,(dept.converted||0).toLocaleString()+" of "+(dept.opp||0).toLocaleString()+" opps")}
              {tile("OPPORTUNITIES",(dept.opp||0).toLocaleString(),BLUE,"of "+(dept.jobs||0).toLocaleString()+" jobs")}

            {gauge("OPP CONVERSION",dept.conv,45,col(dept.conv))}
          </div>
          {card("Opportunity Conversion by Tech","% of opportunity jobs converted · min 50 jobs",rankBar([...techs].filter(c=>c.jobs>=50).sort((a,b)=>b.conv-a.conv).slice(0,15),"conv",GOLD,v=>v+"%",c=>fmt(c.rev)))}

        {tab==="memb" && (<React.Fragment>
          <div style={{padding:"16px 24px 0",display:"flex",gap:14,flexWrap:"wrap"}}>
            <div style={{flex:"2 1 300px",display:"flex",gap:12,flexWrap:"wrap"}}>
              {tile("MEMBERSHIPS SOLD",dept.memb,GREEN,D.dateRange)}
              {tile("MEMBERSHIP OPPS",(dept.membOpp||0).toLocaleString(),BLUE,"eligible jobs")}
              {tile("CONVERSION",dept.membConv+"%",GOLD,"sold ÷ opps")}
            </div>
            {gauge("MEMBERSHIP CONV",dept.membConv,30,col((dept.membConv||0)+15))}
          </div>
          {card("Memberships Sold by Tech","top 15 · membership conversion %",rankBar([...techs].sort((a,b)=>b.mSold-a.mSold).slice(0,15),"mSold",GREEN,v=>v,c=>c.mConv+"% conv"))}
        </React.Fragment>)}

        {tab==="iaq" && (<React.Fragment>
          <div style={{padding:"16px 24px 0",display:"flex",gap:12,flexWrap:"wrap"}}>
            {tile("IAQ SOLD",fmt(iaqTot),"#4ADE80",D.dateRange)}
            {tile("BEST MONTH",iaqMo.length?iaqMo.reduce((a,b)=>b.total>a.total?b:a).month.slice(0,3):"—",GOLD,iaqMo.length?fmt(iaqMo.reduce((a,b)=>b.total>a.total?b:a).total):"")}
            {tile("TOP IAQ TECH",(()=>{const t=[...techs].sort((a,b)=>b.iaq-a.iaq)[0];return t?t.name.split(" ")[0]:"—";})(),BLUE,(()=>{const t=[...techs].sort((a,b)=>b.iaq-a.iaq)[0];return t?fmt(t.iaq):"";})())}
          </div>
          {iaqMo.length>1 && card("IAQ Sold by Month","air-quality revenue trend · *Jul partial",iaqChart())}
          {card("IAQ Revenue by Tech","top 15 service techs by IAQ sold",rankBar([...techs].filter(c=>c.iaq>0).sort((a,b)=>b.iaq-a.iaq).slice(0,15),"iaq","#4ADE80",fmt,c=>c.iaqN+" inv"))}
        </React.Fragment>)}

        {tab==="teams" && (
          <div style={{padding:"16px 24px 0",display:"flex",gap:14,flexWrap:"wrap"}}>
            {teams.map((t,i)=>(
              <div key={t.team} className="liftCard" style={{flex:"1 1 280px",background:"#131c30",border:"1px solid #1e2d47",borderTop:"3px solid "+["#5BA4E6","#F5B324","#22c55e"][i%3],borderRadius:16,padding:"16px 20px"}}>
                <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>{t.label}</div>
                <div style={{fontSize:9,color:"#6b7a99",marginBottom:10}}>{t.techs} techs · {(t.jobs||0).toLocaleString()} jobs</div>
                <div style={{fontSize:34,fontWeight:900,color:["#5BA4E6","#F5B324","#22c55e"][i%3]}}>{fmt(t.rev)}</div>
                <div style={{display:"flex",gap:16,marginTop:10,flexWrap:"wrap"}}>
                  {[["OPP CONV",t.conv+"%"],["MEMBERSHIPS",t.memb],["MEMB %",t.membConv+"%"],["LEADS SET",t.leads],["IAQ",fmt(t.iaq)]].map((s,j)=>(
                    <div key={j}><div style={{fontSize:8,color:"#6b7a99",fontWeight:700,letterSpacing:"0.08em"}}>{s[0]}</div><div style={{fontSize:15,fontWeight:800,color:"#e6eefb"}}>{s[1]}</div></div>))}
                </div>
              </div>))}
          </div>)}
      </div>

      <div style={{fontSize:9,color:"#4a5a70",padding:"16px 24px 0",lineHeight:1.5}}>Source: {D.source} · Opp conversion = converted ÷ opportunity jobs · memberships = service agreements sold · leads set = service turnovers to ROPP · IAQ excludes ROPP &amp; parts. *current period partial.</div>
    </div>
  );
}

function Site(){

// ── Confetti engine (triggered by React via window.__celebrate) ───────────────
(function(){
  window.__celebrate = function() {
    var canvas = document.getElementById('confetti-canvas') || document.createElement('canvas');
    canvas.id = 'confetti-canvas';
    document.body.appendChild(canvas);
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    var ctx = canvas.getContext('2d');
    var pieces = Array.from({length:120}, function() { return {
      x: Math.random()*canvas.width, y: -10,
      r: 4+Math.random()*6, vx: -2+Math.random()*4, vy: 3+Math.random()*5,
      color: ['#F5B324','#2E78C7','#4ADE80','#E63946','#a78bfa'][Math.floor(Math.random()*5)],
      rot: Math.random()*360, rspd: -3+Math.random()*6
    }; });
    var frame = 0;
    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      pieces.forEach(function(p) {
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle=p.color; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r); ctx.restore();
        p.x+=p.vx; p.y+=p.vy; p.rot+=p.rspd; p.vy+=0.07;
      });
      frame++;
      if(frame < 160) requestAnimationFrame(draw);
      else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.remove(); }
    }
    draw();
  };
})();

// ── Auto-refresh every 5 minutes so a wall/monitor display stays current ──
// Skips the reload while the Manage panel is open or a form field is focused,
// so an in-progress edit or rebuild is never lost; it retries a minute later.
(function () {
  var EVERY = 5 * 60 * 1000; // 5 minutes
  function busy() {
    if (window.__modalOpen) return true;
    var el = document.activeElement;
    return !!(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
  }
  function tick() {
    if (busy()) { setTimeout(tick, 60 * 1000); return; }
    window.location.reload();
  }
  setTimeout(tick, EVERY);
})();
</script>
